<script>
const DATA = {"modules": [{"id": "basics", "title": "AI Assistants: What They Can and Can’t Do", "short": "The basics", "hours": 0.75, "blurb": "How AI assistants work in plain English, where they shine and where they slip, plus the four-part prompt formula and ten prompts you can use today.", "objectives": ["Explain in plain words how an AI assistant writes its answers.", "Name the jobs AI assistants do well and the ones that need careful checking.", "Write a clear prompt with the four-part formula: role, task, context and format.", "Use ten ready-made prompts to save time this week."], "intro": "No technical background is needed. Open any AI assistant in another tab or app (a free version is fine) so you can try each idea as you go.", "lessons": [{"title": "What an AI assistant actually is", "blocks": [{"t": "p", "x": "AI assistants such as ChatGPT, Gemini, Claude, Copilot and Grok are built on **large language models**: software trained on huge amounts of text to predict which words are likely to come next. When you send a message, the assistant writes its reply piece by piece, based on the patterns it learned and on everything you have given it in the conversation."}, {"t": "p", "x": "That one idea explains most of what you will see. Assistants are excellent with language: drafting, rewriting, summarising, explaining, brainstorming and organising. They can also be confidently wrong, because a fluent, well-written sentence is not the same thing as a checked fact."}, {"t": "h", "x": "What many assistants can do today"}, {"t": "ul", "items": ["**Files**: read documents, PDFs and spreadsheets that you upload.", "**Images**: describe photos and screenshots, and create new images.", "**Web search**: look things up and show their sources (in some tools and modes).", "**Voice**: hold a spoken conversation or take dictation.", "**Memory**: remember your preferences across chats, when that feature is on."]}, {"t": "callout", "title": "Features vary, skills don’t", "x": "Tools change often, and free and paid plans differ. This course teaches skills that work in any assistant. If a feature mentioned here is missing from yours, check its help pages or settings.", "kind": "cue"}, {"t": "p", "x": "This course names popular assistants only as examples. It is independent and is not affiliated with or endorsed by any AI company."}]}, {"title": "Where AI helps, and where it doesn’t", "blocks": [{"t": "p", "x": "The quickest way to get value from AI is to give it the right jobs. Think of it as a fast, keen assistant who has read a lot but checked very little."}, {"t": "h", "x": "Great jobs to hand over"}, {"t": "ul", "items": ["First drafts of emails, messages, posts and documents.", "Summaries of long text that **you** provide.", "Turning messy notes into lists, plans and tables.", "Explaining a topic at your level, then quizzing you on it.", "Brainstorming ideas, names, headlines and angles.", "Rewriting for tone, length or reading level.", "Spreadsheet formulas, explained step by step."]}, {"t": "h", "x": "Use with care, and check every time"}, {"t": "ul", "items": ["**Facts and figures**: names, dates, numbers, quotes and sources can be wrong or invented.", "**Recent events**: an assistant only knows what was in its training data, which stops at a cut-off date, unless it searches the web.", "**Maths in its head**: ask for a formula or for the working to be shown, then check it.", "**Legal, medical, money and tax questions**: useful for preparing your questions, not as the final answer. Ask a qualified professional."]}, {"t": "h", "x": "Keep for yourself"}, {"t": "ul", "items": ["Final decisions, especially decisions about people.", "Anything you cannot check before you use it.", "Private or confidential information (Module 7 shows you what not to paste)."]}, {"t": "callout", "title": "The golden rule", "x": "You are the editor, not the audience. AI drafts; you decide what is true, what is right and what gets sent.", "kind": "tip"}]}, {"title": "The four-part prompt formula", "blocks": [{"t": "p", "x": "A **prompt** is the message you give the assistant. Vague in, vague out: most disappointing answers come from prompts that leave the assistant guessing. The fix is a simple formula with four parts."}, {"t": "cards", "hdr": ["Part", "What it does", "Example"], "rows": [["Role", "Tells the assistant whose point of view or expertise to use.", "“You are an experienced office manager.”"], ["Task", "The job itself, starting with a clear verb.", "“Write a short email asking the team to send their timesheets by Thursday.”"], ["Context", "The facts it cannot guess: who it is for, the background, the goal.", "“The team is 12 people, some are new, and several were late last month. Keep it friendly, not a telling-off.”"], ["Format", "The shape of the answer: length, structure and tone.", "“Under 120 words, with a subject line and the steps as a short bullet list.”"]]}, {"t": "ba", "bad": "Write an email about timesheets.", "good": "You are an experienced office manager. Write a short email asking the team to send their timesheets by Thursday. The team is 12 people, some are new, and several were late last month, so keep it friendly, not a telling-off. Under 120 words, with a subject line and the steps as a short bullet list.", "why": "The stronger prompt answers the questions the assistant would otherwise guess: who is writing, for whom, why, and in what shape."}, {"t": "p", "x": "You do not need all four parts every time. For a quick question, the task alone is fine. When the answer matters, add the other three."}, {"t": "callout", "title": "Remember it as R-T-C-F", "x": "Role, Task, Context, Format. If an answer disappoints you, check which of the four was missing, add it, and ask again.", "kind": "tip"}]}, {"title": "Try it: build your first prompt", "blocks": [{"t": "p", "x": "Use the prompt builder below. Fill in each box, copy the finished prompt, and paste it into your assistant. Pick a real task from your week, such as a message you need to send or a plan you need to make."}, {"t": "builder"}, {"t": "p", "x": "When the answer arrives, read it properly, then ask for one improvement, for example “Make it shorter”, “Make it warmer” or “Give me two other versions”. Improving an answer with a follow-up is a skill in itself, and Module 2 goes deeper."}, {"t": "check", "id": "m1-first", "title": "Your first prompt", "items": ["I gave the assistant a role.", "My task starts with a clear verb.", "I added context it could not have guessed.", "I said what format I wanted.", "I read the answer and asked for one improvement.", "I checked any names, dates and numbers before using it."]}]}, {"title": "10 prompts that save time this week", "blocks": [{"t": "p", "x": "Copy any prompt below, replace the parts in [square brackets] with your own details, and paste it into your assistant. Every prompt in this course is also in your **Prompt toolkit** (in the menu), so you can find it again later."}, {"t": "callout", "title": "Before you paste anything", "x": "Only paste text your workplace or school allows you to share with an AI tool, and remove names and private details first. Module 7 covers this fully.", "kind": "warn"}, {"t": "prompt", "title": "1. Inbox triage", "x": "Here are [number] emails I need to deal with. For each one, give me a one-line summary, whether it needs a reply, and how urgent it is (high, medium or low). Then suggest the order to handle them in.\n\n[paste the emails, with names and private details removed]"}, {"t": "prompt", "title": "2. Reply drafter", "x": "Draft a reply to the message below. My answer is: [yes / no / your main point]. Tone: [friendly / formal]. Keep it under [80] words.\n\nMessage:\n\"\"\"\n[paste the message]\n\"\"\""}, {"t": "prompt", "title": "3. Meeting notes to actions", "x": "Turn these meeting notes into: 1) a three-sentence summary, 2) a table of action items with owner and deadline, and 3) a list of open questions. Do not add anything that is not in the notes.\n\n\"\"\"\n[paste your notes]\n\"\"\""}, {"t": "prompt", "title": "4. Explain it simply", "x": "Explain [topic] to me as if I am completely new to it. Use plain words and one everyday example, and finish with three questions I could answer to check that I understand."}, {"t": "prompt", "title": "5. Plan my week", "x": "Help me plan my week. My fixed commitments are: [list]. My tasks are: [list, with a rough time for each]. I do my best work in the [mornings / afternoons]. Give me a day-by-day plan with breaks, and flag anything that will not fit."}, {"t": "prompt", "title": "6. Shorter and clearer", "x": "Rewrite the text below so it is clearer and about half the length. Keep every fact and number exactly as written. Then list what you removed.\n\n\"\"\"\n[paste the text]\n\"\"\""}, {"t": "prompt", "title": "7. Spreadsheet formula", "x": "I use [Excel / Google Sheets]. Column A has [dates], column B has [categories] and column C has [amounts]. Write a formula that [adds up the amounts where the category is “Food”]. Explain how it works in plain words."}, {"t": "prompt", "title": "8. Brainstorm", "x": "Give me 15 ideas for [goal], grouped into three themes. Mark the three that are quickest to try, and say why."}, {"t": "prompt", "title": "9. Weigh up a decision", "x": "I am deciding between [option A] and [option B]. What matters most to me is [your priorities]. Compare the options in a table of pros and cons, then ask me three questions that would help me decide. Do not decide for me."}, {"t": "prompt", "title": "10. Quiz me", "x": "Quiz me on [topic] with five questions, one at a time. Wait for my answer before giving feedback, and explain anything I get wrong."}, {"t": "callout", "title": "Check before you use", "x": "These prompts save time on the first draft. Before anything goes out, check names, numbers, dates and promises yourself.", "kind": "cue"}]}], "takeaways": ["AI assistants predict likely text from patterns; fluent does not mean correct.", "Hand over drafting, summarising, organising, explaining and brainstorming.", "Check facts, recent events and maths; use professionals for legal, medical and money decisions.", "Prompt formula: Role, Task, Context, Format (R-T-C-F).", "You are the editor: AI drafts, you decide what is true and what gets sent."], "quiz": [{"q": "How does an AI assistant built on a large language model produce its replies?", "options": ["It looks up each answer in a database of facts that experts have already checked", "It predicts likely next words from patterns in its training text and your conversation", "A team of human experts reads your message and types each reply in real time", "It copies the first web page that matches your question and tidies the wording"], "answer": 1, "explain": "Large language models generate text by predicting what is likely to come next, based on patterns learned in training and on the conversation so far. That is why answers sound fluent but still need checking."}, {"q": "Which job can you most safely hand to an AI assistant?", "options": ["Confirming the exact date of last week’s change to a law", "Giving a final diagnosis for a symptom you have", "Turning your own rough notes into a tidy first draft", "Working out the tax figure you will submit"], "answer": 2, "explain": "Reorganising and drafting from material you provide plays to an assistant’s strengths, and you can easily check the result. Recent legal facts, medical diagnoses and tax figures need reliable sources or a qualified professional."}, {"q": "In the prompt formula, “The team is 12 people, and several were late last month” is an example of which part?", "options": ["Role", "Task", "Context", "Format"], "answer": 2, "explain": "Context gives the assistant facts it cannot guess: the audience, the background and the goal."}, {"q": "“Answer in under 100 words, as a bullet list” is an example of which part of the formula?", "options": ["Role", "Task", "Context", "Format"], "answer": 3, "explain": "Format sets the shape of the answer: length, structure and tone."}, {"q": "Why might an assistant give you out-of-date information about recent news?", "options": ["Its training data stops at a cut-off date, and it may not search the web", "Assistants are deliberately blocked from answering any question about the news", "Your prompt was too short, so it chose an older answer to be safe", "Assistants only update their knowledge once you have paid for a plan"], "answer": 0, "explain": "A model only knows what was in its training data, which stops at a cut-off date. Some assistants can search the web for newer information, but you should still check the sources."}, {"q": "What does “you are the editor, not the audience” mean in practice?", "options": ["Read AI answers for ideas and enjoyment, but never use them for real work", "Let the assistant edit your work, then let it send the final version for you", "Check and decide what is true and what gets used before anything goes out", "Only use AI to edit text you wrote, and never ask it for a first draft"], "answer": 2, "explain": "AI produces drafts. You stay responsible for checking facts, judging what is right and deciding what is sent."}, {"q": "A colleague says, “I asked the AI, so it must be right.” What is the best reply?", "options": ["“True: answers from AI tools are checked by experts before you see them.”", "“AI answers can sound confident and still be wrong, so let’s check the key facts.”", "“Only the paid versions of AI tools are accurate, so it depends which you used.”", "“It is right as long as the answer is long, detailed and sounds professional.”"], "answer": 1, "explain": "Confidence and detail are not proof. Any assistant, free or paid, can make mistakes or invent details, so important facts need checking against a reliable source."}], "num": 1}, {"id": "prompts", "title": "Prompts That Work", "short": "Prompting", "hours": 0.75, "blurb": "Get better answers first time: be specific, show examples, iterate with follow-ups and use five power patterns that work in any assistant.", "objectives": ["Write specific prompts with a clear goal, audience and limits.", "Use examples, templates and clear markers to guide the answer.", "Improve an answer through short, targeted follow-ups.", "Apply five power patterns, from “ask me questions first” to “critique, then improve”."], "intro": "Have your assistant open. Each lesson has prompts to copy and try with a task from your own week.", "lessons": [{"title": "Be specific: goal, audience and limits", "blocks": [{"t": "p", "x": "The more an assistant has to guess, the more generic its answer. Specific prompts name the goal, the audience and the limits."}, {"t": "ul", "items": ["**Goal**: what the result is for. “So my manager can approve it in two minutes.”", "**Audience**: who will read or use it. “For customers who are not technical.”", "**Limits**: length, reading level, words to avoid, spelling style. “Under 150 words, no jargon, UK English.”", "**What to leave out**: “Do not mention prices.” Saying what you do not want is just as useful."]}, {"t": "ba", "bad": "Give me some tips for a presentation.", "good": "I am giving a 10-minute presentation to senior managers next week to ask for budget for a new booking system. Give me 5 tips for making a clear case in a short time. They are busy and sceptical of new software. Keep each tip to two sentences.", "why": "Goal, audience, situation and limits turn generic advice into advice you can use."}, {"t": "callout", "title": "Quick test", "x": "Read your prompt as if you were a new colleague. Would you know exactly what to produce? If not, the assistant will not either.", "kind": "tip"}]}, {"title": "Show, don’t just tell: examples and templates", "blocks": [{"t": "p", "x": "Examples are one of the most reliable ways to get the style you want. Instead of describing a tone, show it."}, {"t": "ul", "items": ["**Give an example**: “Here is a post I liked. Write three more in the same style.”", "**Use your own writing**: paste two or three messages you wrote and ask it to match your tone.", "**Give a template**: provide the headings or the structure, and ask it to fill them in.", "**Use clear markers**: put pasted text between triple quotes (\"\"\") or labels such as “Text starts here” and “Text ends here”, so the assistant can tell your instructions apart from the text it should work on."]}, {"t": "prompt", "title": "Match my style", "x": "Here are three messages I have written:\n\"\"\"\n[paste two or three short examples of your writing]\n\"\"\"\nDescribe my writing style in five bullet points. Then use that style to write [what you need]."}, {"t": "prompt", "title": "Fill my template", "x": "Use this exact structure and keep the headings as they are:\n\nSummary:\nWhat happened:\nWhat we will do next:\nWho to contact:\n\nFill it in using these notes:\n\"\"\"\n[paste notes]\n\"\"\""}]}, {"title": "Iterate: the follow-up is where it gets good", "blocks": [{"t": "p", "x": "A first answer is a first draft. Most of the value comes from one or two short follow-ups that steer it towards what you need."}, {"t": "h", "x": "Follow-ups worth memorising"}, {"t": "ul", "items": ["“Make it half the length.”", "“More formal.”", "“Warmer and more casual.”", "“Give me three different versions.”", "“What is missing or unclear?”", "“Keep the first paragraph and rewrite the rest.”", "“Turn this into a table.”", "“Explain your reasoning for point 3.”"]}, {"t": "p", "x": "Be precise about what to change and what to keep. “Better” is vague; “shorter, with the deadline in the first line” is not."}, {"t": "callout", "title": "When to start a fresh chat", "x": "In a very long conversation, an assistant can lose track of details from early on or keep repeating an approach you have rejected. Start a new chat with one improved prompt that includes everything important. It is often faster than arguing with the old one.", "kind": "cue"}]}, {"title": "Five power patterns", "blocks": [{"t": "p", "x": "These patterns work in any assistant. Each one solves a common problem."}, {"t": "cards", "hdr": ["Pattern", "When to use it", "Add this to your prompt"], "rows": [["Ask me first", "The task depends on details the assistant does not know yet.", "“Before you answer, ask me up to five questions you need answered to do this well.”"], ["Step by step", "Maths, logic or a process with several stages.", "“Work through this step by step and show your working.”"], ["Critique, then improve", "You have a draft and want it stronger.", "“List the three biggest weaknesses in this draft, then rewrite it to fix them.”"], ["Options, not one answer", "You want to choose, not be told.", "“Give me three versions: short, medium and detailed.”"], ["Practise with me", "Rehearsing an interview, a hard conversation or a pitch.", "“Play the role of [person]. Ask me one question at a time and give me feedback at the end.”"]]}, {"t": "prompt", "title": "Ask me first", "x": "I need to [task]. Before you start, ask me up to five questions that would help you do this well. Wait for my answers."}, {"t": "callout", "title": "“If you’re not sure, say so”", "x": "Adding “If you are not sure about something, say so rather than guessing” can reduce made-up answers. It does not remove them, so you still check the facts that matter.", "kind": "warn"}]}, {"title": "Practice: fix the prompt", "blocks": [{"t": "p", "x": "Here are three weak prompts and stronger versions. Before you read each stronger version, try improving the weak one yourself."}, {"t": "ba", "bad": "Summarise this.", "good": "Summarise the report below for my team leader, who has two minutes. Give five bullet points: the main finding, the two biggest risks, the cost, and the decision needed. Use only information from the report.\n\n\"\"\"\n[paste the report]\n\"\"\"", "why": ""}, {"t": "ba", "bad": "Write a LinkedIn post about my new job.", "good": "Write a LinkedIn post announcing that I have started as [job title] at [company]. Thank my previous team at [company] briefly. Tone: warm and professional, not boastful. Under 120 words, no hashtags, no emojis. Give me two versions.", "why": ""}, {"t": "ba", "bad": "Make a workout plan.", "good": "Act as a careful fitness coach. I am a beginner, I have 30 minutes on Monday, Wednesday and Friday, and I train at home with no equipment. Write a simple 4-week plan in a table. Include warm-ups, and tell me when I should check with a doctor first.", "why": "Even health and fitness prompts benefit from context. For medical conditions, injuries or pregnancy, check with a qualified professional before following any plan."}, {"t": "check", "id": "m2-quality", "title": "Prompt quality check", "items": ["The goal and the audience are clear.", "I gave the facts the assistant cannot guess.", "I set limits: length, tone and anything to avoid.", "Pasted text sits between clear markers.", "I planned at least one follow-up to improve the answer."]}]}], "takeaways": ["Specific prompts name the goal, the audience and the limits, including what to leave out.", "Examples and templates beat descriptions; use clear markers around pasted text.", "Treat the first answer as a draft and steer it with precise follow-ups.", "In very long chats, start fresh with one improved prompt.", "Power patterns: ask me first, step by step, critique then improve, options, practise with me."], "quiz": [{"q": "Which prompt is most likely to get a useful answer first time?", "options": ["“Help with my presentation, please. Make it really good and very professional.”", "“Presentation tips please. I want the best possible tips you can think of.”", "“Give 5 tips for a 10-minute budget pitch to busy, sceptical managers, two sentences each.”", "“Make my presentation better. Use your expertise and be as detailed as you can.”"], "answer": 2, "explain": "It states the situation, the audience, the goal and the limits, so the assistant has far less to guess."}, {"q": "What is the main benefit of pasting a few messages you wrote yourself?", "options": ["It makes the assistant work faster", "The assistant can match your tone and style", "It stops the assistant from making factual mistakes", "It is required before an assistant will write anything"], "answer": 1, "explain": "Examples are one of the most reliable ways to show the style you want. They do not make facts more accurate."}, {"q": "Why put pasted text between clear markers such as triple quotes?", "options": ["It encrypts the pasted text so that the AI company cannot store or read it", "It tells the assistant to give a longer and more detailed answer than usual", "It helps the assistant tell your instructions apart from the text to work on", "It is the only way most assistants will accept text that you have pasted in"], "answer": 2, "explain": "Markers separate “what to do” from “what to do it to”. They offer no privacy protection."}, {"q": "The first draft is too long and too formal. What is the best next step?", "options": ["Send it anyway; AI knows best", "Type the same prompt again and hope for a different result", "Reply: “Make it half the length and more casual.”", "Close the app and write it from scratch"], "answer": 2, "explain": "A short, precise follow-up is usually the fastest route to what you need."}, {"q": "A long chat has started ignoring instructions you gave at the start. What is the sensible move?", "options": ["Keep repeating the instruction in capital letters until the assistant follows it", "Start a new chat with one improved prompt that includes the key details", "Delete your earlier messages so the assistant pays more attention", "Accept that the assistant cannot do this task and do it by hand"], "answer": 1, "explain": "Very long conversations can lose track of early details. A fresh chat with everything important in one prompt often works better."}, {"q": "When is “Before you answer, ask me up to five questions” most useful?", "options": ["When you want the shortest, quickest possible reply to a simple request", "When the task depends on details the assistant does not know yet", "When you are asking a simple yes-or-no question about a well-known fact", "When you want the assistant to search the web instead of using its training"], "answer": 1, "explain": "Letting the assistant ask questions first fills in the context it would otherwise guess."}, {"q": "What does adding “If you are not sure, say so” do?", "options": ["Guarantees that every answer in the chat is accurate and fully checked", "Can reduce made-up answers, but you still need to check facts", "Makes the assistant refuse any question where it might make a mistake", "Switches on the assistant’s web search so it can confirm its answers"], "answer": 1, "explain": "It is a helpful instruction, but no prompt removes the need to verify important facts."}], "num": 2}, {"id": "writing", "title": "Emails, Messages and Documents", "short": "Writing", "hours": 0.75, "blurb": "Draft and reply in minutes, get the tone right for tricky messages, turn notes into documents, and proofread without losing your meaning or your voice.", "objectives": ["Draft emails and replies quickly, then personalise them.", "Adjust tone for polite refusals, follow-ups and difficult messages.", "Turn rough notes into agendas, reports and how-to guides.", "Proofread and edit with AI while keeping your meaning and your voice.", "Follow your workplace or school rules on using AI for writing."], "intro": "Pick two or three real messages or documents from your week to practise on, and remove any private details first.", "lessons": [{"title": "Drafting emails in minutes", "blocks": [{"t": "p", "x": "For most emails you already know what you want to say. The assistant’s job is to turn that into clear, polite sentences fast."}, {"t": "h", "x": "The reply recipe"}, {"t": "ol", "items": ["Paste the message you are replying to, between clear markers.", "State your answer or main point in a few words.", "Say the tone and the length.", "Ask for a subject line if it is a new email."]}, {"t": "prompt", "title": "Reply recipe", "x": "Draft a reply to the email below.\nMy main point: [e.g. yes, I can attend, but only from 2 pm].\nTone: [friendly and professional].\nLength: under [100] words.\n\n\"\"\"\n[paste the email]\n\"\"\""}, {"t": "p", "x": "Then make it yours. Add one detail only you know, fix anything that does not sound like you, and check every name, date and promise before you send."}, {"t": "callout", "title": "Watch for invented promises", "x": "Assistants sometimes add helpful-sounding extras such as “I’ll send the report by Friday”. If you did not decide it, delete it.", "kind": "warn"}]}, {"title": "Getting the tone right", "blocks": [{"t": "p", "x": "Tone is where AI saves the most stress. When a message feels hard to write, describe the situation and the tone, and let the assistant give you a calm first draft."}, {"t": "cards", "hdr": ["Situation", "Ask for", "Example prompt"], "rows": [["Saying no", "Polite and clear, with an alternative.", "“Write a polite no to this request. Offer [alternative] instead. Do not over-apologise.”"], ["Chasing a reply", "Friendly and firm.", "“Write a short, friendly follow-up. It is my second reminder; the deadline is [date].”"], ["A complaint", "Calm, factual, with a clear ask.", "“Help me complain about [issue]. Stick to the facts below and ask for [outcome].”"], ["Bad news", "Honest, kind and specific about next steps.", "“Help me tell the team [news]. Be direct and kind, and list what happens next.”"]]}, {"t": "p", "x": "Ask for two or three versions on a scale, for example “gentle, neutral and firm”, and pick the one that fits."}, {"t": "callout", "title": "A rule worth keeping", "x": "Do not send anything you would not be comfortable saying to the person directly. If you are angry, ask the assistant to make your draft calmer, not sharper.", "kind": "cue"}]}, {"title": "From notes to documents", "blocks": [{"t": "p", "x": "Longer documents work best in stages: outline first, then sections. You stay in control of the structure, and the assistant does the heavy lifting."}, {"t": "ol", "items": ["**Brief it**: purpose, reader, length and any facts it must include.", "**Ask for an outline only**, then edit the outline yourself.", "**Write section by section**, giving extra detail where needed.", "**Finish with a review**: “What is unclear or missing for this reader?”"]}, {"t": "prompt", "title": "Notes to report", "x": "Turn my notes into a one-page report for [reader]. Use these headings: Background, What we found, Recommendation, Next steps. Use only the facts in my notes and mark anything you are unsure of with [CHECK].\n\n\"\"\"\n[paste notes]\n\"\"\""}, {"t": "prompt", "title": "How-to guide", "x": "Write a step-by-step guide for [task] for a new colleague. Number the steps, keep each step to one sentence, and add a short “common mistakes” section at the end. Here is how I do it:\n\"\"\"\n[describe the process in your own words]\n\"\"\""}, {"t": "prompt", "title": "Meeting agenda", "x": "Create an agenda for a [45]-minute meeting about [topic] with [who]. The goal is to [decision or outcome]. Give each item a time and an owner, and leave five minutes for next steps."}]}, {"title": "Editing and proofreading", "blocks": [{"t": "p", "x": "AI is a tireless proofreader, but it likes to rewrite. Tell it exactly how much to change."}, {"t": "prompt", "title": "Proofread only", "x": "Proofread the text below. Fix only spelling, grammar and punctuation. Do not change the meaning, the wording style or any facts. Then list every change you made.\n\n\"\"\"\n[paste text]\n\"\"\""}, {"t": "prompt", "title": "Clarity edit", "x": "Edit this for clarity for a reader who is busy and not an expert. Keep it about the same length, keep all facts and numbers unchanged, and explain your three most important edits.\n\n\"\"\"\n[paste text]\n\"\"\""}, {"t": "h", "x": "Translation"}, {"t": "p", "x": "Assistants can translate well enough to understand the gist of a message or to draft a reply. For anything important, such as contracts, safety instructions, medical or legal text, or anything public, have a fluent speaker or professional translator check it."}]}, {"title": "Your voice, your responsibility", "blocks": [{"t": "p", "x": "AI-written text can sound generic. A few habits keep your messages sounding like you."}, {"t": "ul", "items": ["Give it a sample of your writing to match (Module 2).", "Tell it phrases you never use, for example: “Avoid ‘I hope this email finds you well’ and ‘delve’.”", "Read the draft aloud. If you would not say it, change it.", "Keep it short. Many AI drafts are longer than they need to be."]}, {"t": "h", "x": "Honesty and the rules"}, {"t": "ul", "items": ["Follow your employer’s policy on which AI tools you may use and what you may share with them.", "At school, college or university, follow the rules for each assignment. Using AI where it is not allowed can count as academic misconduct.", "If you are asked whether you used AI, be honest. Where it matters, say how you used it, for example “drafted with an AI assistant, checked and edited by me”."]}, {"t": "check", "id": "m3-send", "title": "Before you hit send", "items": ["Every name, date, number and link is correct.", "There are no promises I did not decide to make.", "The tone fits the person and the situation.", "It sounds like me, and it is no longer than it needs to be.", "Sharing this content with an AI tool was allowed."]}]}], "takeaways": ["Reply recipe: paste the message, state your point, set tone and length.", "Personalise every draft and remove promises you did not decide to make.", "For hard messages, ask for versions on a scale (gentle, neutral, firm).", "Long documents: brief, outline, section by section, then review.", "Proofread with clear limits: “fix only spelling and grammar; list every change”.", "Follow workplace and school AI rules, and be honest about how you used AI."], "quiz": [{"q": "What is the most important thing to add when asking for an email reply?", "options": ["Your main point or answer, plus the tone and length you want", "The exact name and version of the AI model that you are using", "A request to make the reply as long and detailed as possible", "Nothing extra: the assistant can work out the answer you want to give"], "answer": 0, "explain": "The assistant cannot know your decision. Give it your main point, then set the tone and length."}, {"q": "An AI draft says, “I’ll send the full report by Friday,” but you never agreed to that. What should you do?", "options": ["Send it; the deadline will motivate you", "Delete or change it before sending", "Ask the assistant whether you meant it", "Add a second deadline to be safe"], "answer": 1, "explain": "Assistants sometimes add helpful-sounding promises. Anything you did not decide must come out."}, {"q": "You need to turn down a request without damaging the relationship. Which prompt works best?", "options": ["“Say no to this request. Keep it short and do not explain anything.”", "“Write a polite no that offers an alternative and does not over-apologise.”", "“Write a long, detailed apology explaining why I cannot help this time.”", "“Write a no that sounds very formal, so they will not ask me again.”"], "answer": 1, "explain": "Naming the tone and including an alternative gives you a clear, kind refusal."}, {"q": "What is the best way to produce a longer document with AI?", "options": ["Ask for the whole document in one go, then send it without reading it", "Brief it, agree an outline, write section by section, then review", "Ask for the longest possible version, then cut it down to size later", "Paste someone else’s document and ask the assistant to change the names"], "answer": 1, "explain": "Working in stages keeps you in control of the structure and makes errors easier to spot."}, {"q": "You want only spelling and grammar fixed. Which instruction helps most?", "options": ["“Improve this text so it reads better and sounds more professional overall.”", "“Rewrite this professionally for a business audience, keeping it short.”", "“Fix only spelling, grammar and punctuation; do not change the meaning; list every change.”", "“Make this sound smarter and more polished, and fix any mistakes you notice.”"], "answer": 2, "explain": "Clear limits stop the assistant rewriting your meaning, and the list of changes lets you check its work."}, {"q": "When is an AI translation enough on its own?", "options": ["For a safety instruction sign that will go up at work", "For understanding the gist of an informal message", "For a contract that both sides are about to sign", "For instructions on how to take a prescribed medicine"], "answer": 1, "explain": "For gist and informal drafts, AI translation is often good. Important, legal, medical or public text needs checking by a fluent speaker or professional."}, {"q": "At university, an assignment says AI tools are not allowed. What is the right approach?", "options": ["Use AI, but rewrite the wording so it is harder to detect", "Follow the rule and do not use AI for that assignment", "Use AI only for the conclusion, as that part matters less", "Ask a friend to use AI for you, then copy what they send"], "answer": 1, "explain": "Assignment rules apply. Using AI where it is not allowed can count as academic misconduct."}], "num": 3}, {"id": "research", "title": "Research, Summaries and Fact-Checking", "short": "Research & checking", "hours": 0.75, "blurb": "Get summaries you can use, research a topic with sources, spot hallucinations and fake citations, and check any claim in five minutes.", "objectives": ["Ask for summaries shaped to a purpose and a reader.", "Use an assistant to research a topic and find sources worth opening.", "Recognise hallucinations, including invented quotes and citations.", "Check important claims with a quick five-step method.", "Compare options in a table and spot the assumptions behind it."], "intro": "This is the most important module for trusting what you use. The habits here protect your reputation every time you rely on AI.", "lessons": [{"title": "Summaries that are actually useful", "blocks": [{"t": "p", "x": "“Summarise this” gets you a shorter version. A useful summary is shaped for a purpose and a reader."}, {"t": "ul", "items": ["**Key points**: “Five bullet points a busy manager needs.”", "**Decisions and actions**: “What was decided, who does what, by when.”", "**What it means for me**: “I am a [role]. What in this affects me, and what should I do?”", "**Questions**: “What are the three questions I should ask about this?”"]}, {"t": "prompt", "title": "Purpose-led summary", "x": "Summarise the document below for [reader], who needs to [decide / act / understand] [what]. Give: 1) a two-sentence overview, 2) the five most important points, 3) anything that needs action, with deadlines. Quote the exact wording for any number or deadline.\n\n\"\"\"\n[paste text or upload the file]\n\"\"\""}, {"t": "callout", "title": "Long files", "x": "With long documents, assistants can miss or blur parts. For anything important, ask for a section-by-section summary, and ask it to quote the original wording for key facts so you can find them and check.", "kind": "cue"}]}, {"title": "Researching with AI", "blocks": [{"t": "p", "x": "An assistant is a great starting point for research: it can map a topic, explain the key terms and suggest what to look for. The final facts should come from sources you have opened yourself."}, {"t": "ol", "items": ["**Map the topic**: “What are the main sub-topics and key terms I should understand about [topic]?”", "**Use web search where available**: many assistants have a search mode that lists sources. Ask for sources for each claim.", "**Open the sources**: read what they actually say. A link is not proof until you have checked it.", "**Prefer primary sources**: official websites, government data, original studies and the organisation itself, rather than a blog quoting a blog.", "**Note the date**: prices, rules and statistics change."]}, {"t": "prompt", "title": "Research starter", "x": "I am researching [topic] for [purpose]. 1) Explain the key ideas in plain words. 2) List the questions I should answer. 3) For each question, suggest the type of reliable source that would answer it (for example official statistics, a regulator, or a peer-reviewed study). Do not invent specific titles or links."}]}, {"title": "Hallucinations: when AI makes things up", "blocks": [{"t": "p", "x": "A **hallucination** is an answer that sounds right but is false or invented. It happens because the model generates likely-sounding text; it does not look facts up unless a search tool is involved, and even then it can misread a source."}, {"t": "h", "x": "Common forms"}, {"t": "ul", "items": ["Quotes that nobody said, or real quotes given to the wrong person.", "Citations to articles, books, studies or court cases that do not exist.", "Precise-looking numbers and statistics with no real source.", "Product features, prices or policies that are out of date or invented.", "Two similar people, places or companies mixed up."]}, {"t": "callout", "title": "A real-world warning", "x": "In 2023, a US court sanctioned lawyers who filed a legal brief citing court cases that a chatbot had invented. Similar cases have followed in other countries. Fluent, formal text is not evidence.", "kind": "warn"}, {"t": "h", "x": "Warning signs"}, {"t": "ul", "items": ["Very specific figures with no source.", "Links that do not open or lead somewhere unrelated.", "Sources that, when you open them, do not say what the answer claims.", "An answer that changes when you ask the same question again."]}]}, {"title": "Fact-checking in five minutes", "blocks": [{"t": "p", "x": "You do not need to check every word. Check the claims that matter: anything you will repeat, act on, publish or send."}, {"t": "ol", "items": ["**Pick the claims that matter**: names, numbers, dates, quotes, rules and prices.", "**Open the source**: not just the link text, the page itself.", "**Confirm it says the same thing**: the same number, the same date, the same meaning.", "**Cross-check once**: find a second independent, reliable source. Fact-checkers call this reading laterally.", "**Check the date**: is it still current?"]}, {"t": "prompt", "title": "Claim finder", "x": "List every factual claim in the text below that I should verify before I use it. For each claim, say what kind of reliable source would confirm it. Do not verify them yourself; just list them.\n\n\"\"\"\n[paste text]\n\"\"\""}, {"t": "check", "id": "m4-check", "title": "Fact-check checklist", "items": ["I listed the claims that matter.", "I opened the sources myself.", "Each source says what the answer claims.", "Key facts are confirmed by a second reliable source.", "The information is current."]}]}, {"title": "Comparing options and spotting assumptions", "blocks": [{"t": "p", "x": "Assistants are good at laying out options side by side. They are less good at knowing current prices, stock or your exact situation."}, {"t": "prompt", "title": "Comparison table", "x": "Compare [option A], [option B] and [option C] for [my situation]. Use a table with these criteria: [cost, ease of use, support, …]. Then list every assumption you made, and tell me what I should check on the official websites before deciding."}, {"t": "p", "x": "Always check prices, plans, opening hours and rules on the official source on the day you decide: they change often, and the assistant may be working from old information."}, {"t": "callout", "title": "Ask for the other side", "x": "Before a decision, try: “What is the strongest argument against the option I am leaning towards?” It is a quick way to spot what you have missed.", "kind": "tip"}]}], "takeaways": ["Shape summaries for a purpose and a reader; ask for exact quotes of key facts.", "Use AI to map a topic; get final facts from sources you have opened yourself.", "Hallucinations include fake quotes, citations, numbers and features.", "Five-step check: pick claims, open source, confirm, cross-check, check the date.", "For comparisons, ask for assumptions and confirm prices and rules on official sites."], "quiz": [{"q": "What makes a summary most useful?", "options": ["Making it as short as it can possibly be", "Shaping it for a specific purpose and reader", "Asking for it in a more formal style of English", "Asking for it twice and joining the two results"], "answer": 1, "explain": "A summary is useful when it serves a purpose: what this reader needs to know, decide or do."}, {"q": "What is an AI “hallucination”?", "options": ["An answer that sounds right but is false or invented", "A deliberate lie the assistant tells to trick or mislead you", "An unusual or dream-like image created by an AI image tool", "A strange reply caused by a slow or weak internet connection"], "answer": 0, "explain": "Hallucinations are false or invented content presented fluently. They come from how models generate text, not from intent."}, {"q": "An assistant gives you a study title, its authors and a link. What should you do before quoting it?", "options": ["Quote it as it is: a full title, named authors and a link mean it is real", "Open the link and confirm the study exists and says what was claimed", "Ask the assistant whether it is sure, and quote it if the answer is yes", "Remove the link but keep the quote, so nobody can say it is wrong"], "answer": 1, "explain": "Assistants can invent citations or misreport real ones. Open the source and check it yourself."}, {"q": "Which is the best example of a primary source for a new government rule?", "options": ["A busy online forum thread where people discuss the rule", "The official government website that published the rule", "An AI summary of several news articles about the rule", "A popular video in which a creator reacts to the rule"], "answer": 1, "explain": "Primary sources come from the organisation that made the rule or collected the data."}, {"q": "In the five-minute fact-check, what does “cross-check once” mean?", "options": ["Ask the same assistant the same question again and compare", "Confirm the claim with a second independent, reliable source", "Check the spelling and grammar of the claim one more time", "Ask a friend or colleague whether the claim sounds right"], "answer": 1, "explain": "Looking at a second independent source (reading laterally) is how professional fact-checkers confirm claims."}, {"q": "Which claim most needs checking before you send a report?", "options": ["A sentence describing the purpose of the report", "“Costs rose 17.4% in the last quarter”", "A heading that says “Next steps”", "A greeting at the start of the email"], "answer": 1, "explain": "Precise numbers are exactly the kind of detail that can be wrong or invented. Check them against the original source."}, {"q": "An assistant’s comparison table lists current prices for three services. What should you do?", "options": ["Trust them, because the table looks clear and professional", "Confirm the prices on each official website before deciding", "Pick the cheapest option straight away, before prices change", "Ask the assistant to round the prices so they are easier to compare"], "answer": 1, "explain": "Prices change often and the assistant may be using old information. Check official sources on the day you decide."}], "num": 4}, {"id": "planning", "title": "Planning: Schedules, Study Plans and Everyday Life", "short": "Planning", "hours": 0.5, "blurb": "Turn big goals into next steps, plan a realistic week, build a study plan that works, and organise meals, trips and events with less effort.", "objectives": ["Break a large goal into clear, dated steps.", "Plan a realistic week around your fixed commitments.", "Build a study plan using spaced practice and self-testing.", "Plan meals, shopping, trips and events, and check the details that matter."], "intro": "Have a real goal or a busy week in mind. You will finish this module with at least one plan you can use.", "lessons": [{"title": "Break any goal into steps", "blocks": [{"t": "p", "x": "Big goals stall because the next step is unclear. Assistants are very good at breaking a goal into stages, steps and a first action."}, {"t": "prompt", "title": "Goal breakdown", "x": "My goal is [goal] by [date]. I can spend about [hours] per week on it. Break it into stages, then into steps of no more than an hour each. Put dates on the stages, working back from the deadline, and tell me the very first step to do today."}, {"t": "p", "x": "Then edit the plan. You know things the assistant does not: holidays, busy weeks, and how long things really take you."}, {"t": "callout", "title": "Add a buffer", "x": "Plans are usually too optimistic. Ask the assistant to add 20–30% extra time, or add it yourself.", "kind": "cue"}]}, {"title": "Plan a realistic week", "blocks": [{"t": "p", "x": "A good weekly plan puts the important work into protected time, around commitments that cannot move."}, {"t": "prompt", "title": "Weekly plan", "x": "Plan my week from [Sunday / Monday] to [day].\nFixed commitments: [list with times].\nTasks: [list, each with a rough time and deadline].\nEnergy: I focus best in the [morning / afternoon].\nRules: no more than [2] hours of deep work in a row, a lunch break every day, and finish by [time].\nShow it as a table by day, and list anything that does not fit."}, {"t": "ul", "items": ["Put the hardest task in your best-energy slot.", "Group small tasks, such as calls, messages and admin, into one block.", "Leave one empty block for surprises."]}, {"t": "p", "x": "Some assistants can connect to your calendar or email. That can save time, but only connect the accounts you are comfortable sharing, and review any event or message before it is created or sent."}]}, {"title": "Study and learning plans", "blocks": [{"t": "p", "x": "A major review of learning research rated two techniques as especially effective: **spaced practice** (short sessions spread over days, not one long cram) and **practice testing** (recalling answers from memory rather than re-reading). You can build both into an AI-assisted plan."}, {"t": "prompt", "title": "Study plan", "x": "I have [exam / skill] on [date]. Topics: [list]. I can study [time] on [days]. Build a plan that spreads each topic over several sessions (spaced practice), starts each session with a short self-test from memory, and leaves the last [3] days for review. Show it as a table."}, {"t": "prompt", "title": "Quiz me", "x": "Quiz me on [topic] with [10] questions, one at a time. Mix easy and hard questions. Wait for my answer each time, then explain anything I get wrong and repeat those questions at the end."}, {"t": "callout", "title": "Learn, don’t outsource", "x": "Ask for explanations and practice questions, not finished assignments. You only keep the skills you practise yourself, and coursework rules still apply.", "kind": "warn"}]}, {"title": "Everyday planning: meals, shopping, trips and events", "blocks": [{"t": "prompt", "title": "Meals and shopping", "x": "Plan [5] simple dinners for [2] people. Each takes under [30] minutes, uses [ingredients we like] and avoids [allergies or dislikes]. Reuse ingredients across meals to cut waste. Then give me one shopping list grouped by supermarket section."}, {"t": "prompt", "title": "Trip plan", "x": "Plan a [3]-day trip to [place] in [month] for [who]. We like [interests] and our budget is about [amount] per day, not including the hotel. Give a day-by-day plan with travel times between stops, and list what I should check before booking."}, {"t": "prompt", "title": "Event checklist", "x": "I am organising [event] for [number] people on [date]. Create a checklist working back from the day, with what to do 4 weeks, 2 weeks, 1 week and 1 day before, and on the day itself."}, {"t": "callout", "title": "Check the details that change", "x": "Opening hours, prices, travel and visa rules, and booking terms change often. Confirm them on official websites. For medical diets, allergies or health conditions, follow advice from a doctor or registered dietitian.", "kind": "warn"}]}, {"title": "Practice: plan something real", "blocks": [{"t": "p", "x": "Choose one: your next week, a goal for the next three months, a study plan, or a meal plan. Use a prompt from this module, then edit the result until you would actually follow it."}, {"t": "check", "id": "m5-plan", "title": "Is your plan realistic?", "items": ["Fixed commitments are in first.", "Each step is small enough to start today.", "There is buffer time for surprises.", "Deadlines and details are checked against real sources.", "I edited the plan to fit how I really work."]}, {"t": "callout", "title": "Make it a habit", "x": "Each week, paste last week’s plan and ask: “What did I underestimate, and how should I adjust next week?” Plans get better with feedback.", "kind": "tip"}]}], "takeaways": ["Break goals into stages, hour-sized steps and a first action for today.", "Plan weeks around fixed commitments, with deep work in your best-energy slot and a buffer.", "Study with spaced practice and practice testing; ask AI to quiz you.", "Use AI for meals, trips and events, but confirm prices, hours and rules officially.", "Edit every plan to fit how you really work."], "quiz": [{"q": "Why ask an assistant to add 20–30% extra time to a plan?", "options": ["Assistants always make plans far too long, so it balances out", "Plans tend to be too optimistic, and buffers absorb surprises", "It makes the plan look more impressive to a manager or teacher", "Calendar apps require extra time to be added to every task"], "answer": 1, "explain": "Most people underestimate how long tasks take. A buffer keeps the plan realistic."}, {"q": "Which two study techniques have especially strong research support?", "options": ["Re-reading notes and highlighting", "Spaced practice and practice testing", "Cramming the night before and listening to music", "Copying the textbook and summarising it once"], "answer": 1, "explain": "Spreading study over time and testing yourself from memory are among the most effective, well-studied techniques."}, {"q": "In a weekly plan, where should your hardest task usually go?", "options": ["At the end of the day, when everything else is done", "In the time slot when you focus best", "Split into five-minute pieces across the week", "On the day before the deadline"], "answer": 1, "explain": "Matching hard work to your best-energy time makes it more likely to get done well."}, {"q": "An assistant plans your trip, including museum opening hours. What should you do?", "options": ["Trust the hours; they come from the training data", "Check the hours on the museum’s official website", "Ask the assistant to make the hours earlier", "Ignore opening hours completely"], "answer": 1, "explain": "Hours, prices and rules change. Confirm them on official sources before you rely on them."}, {"q": "You want to learn a topic for an exam. Which use of AI builds your own skills best?", "options": ["Ask it to write your coursework so you can study its answers later", "Ask it to explain the ideas and quiz you, one question at a time", "Ask it to summarise the textbook so you can skip all the reading", "Ask it to predict the exam questions and write model answers to learn"], "answer": 1, "explain": "Explanations plus practice questions build understanding, and stay within coursework rules."}, {"q": "Your assistant can connect to your calendar. What is the safest approach?", "options": ["Connect every account you have, so the assistant can help with more things", "Connect only what you are comfortable sharing, and review events before they are created", "Never use a calendar again, because connected AI tools are always unsafe", "Let it accept and decline all of your meeting invites automatically to save time"], "answer": 1, "explain": "Connected tools can save time, but keep control: share only what you are happy to share and review actions first."}], "num": 5}, {"id": "files", "title": "Spreadsheets, Files, Images and Voice", "short": "Data, files & media", "hours": 0.75, "blurb": "Get spreadsheet formulas explained, analyse and tidy data, turn photos and screenshots into notes, and use voice and image tools responsibly.", "objectives": ["Get correct spreadsheet formulas by describing your data clearly, then test them.", "Analyse a data file with AI and check the results yourself.", "Clean and organise messy data safely.", "Turn photos, screenshots and scans into useful notes.", "Use voice and image generation responsibly."], "intro": "If you use Excel or Google Sheets, have a practice spreadsheet open. Use made-up or anonymised data, never real customer or staff details.", "lessons": [{"title": "Spreadsheet formulas without the headache", "blocks": [{"t": "p", "x": "You do not need to remember formulas. You need to describe your data clearly, ask for a formula with an explanation, and test it."}, {"t": "prompt", "title": "Formula request", "x": "I use [Excel / Google Sheets]. My data is in rows 2 to [200]. Column A: [dates]. Column B: [categories]. Column C: [amounts]. I want a formula in [cell] that [adds up the amounts where the category is “Food”]. Give me the formula, explain each part in plain words, and tell me one way to test it."}, {"t": "h", "x": "Formulas you will meet often"}, {"t": "cards", "hdr": ["Formula", "What it does", "Example"], "rows": [["SUMIFS", "Adds up values that match one or more conditions.", "=SUMIFS(C2:C200, B2:B200, \"Food\") adds the amounts in C where column B says Food."], ["COUNTIF", "Counts cells that match a condition.", "=COUNTIF(B2:B200, \"Food\") counts how many rows are Food."], ["IF", "Shows one result if a test is true, another if not.", "=IF(C2>100, \"Check\", \"OK\")"], ["XLOOKUP", "Finds a value and returns a matching value from another column.", "=XLOOKUP(E2, A2:A100, B2:B100, \"Not found\")"]]}, {"t": "callout", "title": "Always test on a small sample", "x": "Try the formula on a few rows where you already know the answer. If it matches, copy it down. In some regional settings, spreadsheets use semicolons (;) instead of commas between the parts of a formula.", "kind": "cue"}]}, {"title": "Analysing data files", "blocks": [{"t": "p", "x": "Many assistants can read an uploaded spreadsheet or CSV file and describe trends, totals and patterns, or suggest a chart. It is fast, but numbers are where mistakes hide."}, {"t": "ol", "items": ["**Ask it to describe the data first**: “How many rows and columns are there? What does each column contain?” If it gets this wrong, stop.", "**Ask your question**: “Which month had the highest sales? Show the figures.”", "**Spot-check**: confirm one or two totals yourself with a simple SUM or filter in the spreadsheet.", "**Ask how it worked it out**, so you can repeat the calculation."]}, {"t": "prompt", "title": "Data first look", "x": "I have uploaded a file with [what the data is]. First, describe the columns and the number of rows. Then give me the three most useful insights for [purpose], with the numbers behind each one, and tell me how I can check each number in the spreadsheet."}, {"t": "callout", "title": "Only upload what you are allowed to", "x": "Customer lists, staff records, health data and financial records usually contain personal or confidential information. Do not upload them unless your organisation has approved the tool for that data.", "kind": "warn"}]}, {"title": "Cleaning and organising data", "blocks": [{"t": "p", "x": "Messy data costs hours: names in one column, dates in different formats, duplicates and inconsistent categories. AI can tell you how to fix it."}, {"t": "ul", "items": ["**Split or join**: “How do I split full names in column A into first and last names?”", "**Fix formats**: “My dates are a mix of 03/04/2026 and 2026-04-03. How do I make them consistent?”", "**Remove duplicates**: “How do I find and remove duplicate email addresses?”", "**Categorise**: “Suggest categories for these expense descriptions.” Then review each one."]}, {"t": "p", "x": "For large tables, ask for the steps or the formula rather than pasting all the data into the chat. It is more reliable and keeps your data where it is."}, {"t": "callout", "title": "Keep the original", "x": "Before any clean-up, save a copy of the original file. If something goes wrong, you can start again.", "kind": "cue"}]}, {"title": "Photos, screenshots and documents", "blocks": [{"t": "p", "x": "Assistants that understand images can save typing. Some handy uses:"}, {"t": "ul", "items": ["**Whiteboard or handwritten notes** into tidy typed notes and action lists.", "**An error message** on screen: “What does this mean, and what should I try first?”", "**A form or letter**: “What is this asking me to do, and by when?”", "**Receipts** into a table of date, shop and amount.", "**A chart**: “What are the three main points this chart shows?”"]}, {"t": "callout", "title": "Check the numbers it reads", "x": "Image reading can misread numbers, especially in handwriting or blurry photos. Check amounts, dates and reference numbers against the original.", "kind": "warn"}, {"t": "p", "x": "Screenshots often include more than you meant to share: notifications, other people’s names, open tabs or account details. Crop them before uploading."}]}, {"title": "Voice and images", "blocks": [{"t": "h", "x": "Voice"}, {"t": "ul", "items": ["Think out loud while walking, then ask for a tidy summary of your ideas.", "Rehearse an interview, a presentation or a difficult conversation.", "Dictate a rough draft, then edit it as text.", "Practise a language with spoken back-and-forth."]}, {"t": "h", "x": "Creating images"}, {"t": "p", "x": "Image tools are useful for mock-ups, slide illustrations, social media drafts and visual ideas. A few rules keep you out of trouble:"}, {"t": "ul", "items": ["Do not create realistic images of real people without their consent, or images that could mislead people about real events.", "Label AI-generated images where your platform, workplace or audience expects it.", "Check any text inside an image carefully; AI images often contain misspelt words.", "Check the tool’s terms before using images commercially, and avoid copying a living artist’s style or a brand’s logo."]}, {"t": "check", "id": "m6-media", "title": "Before you share a file, image or recording", "items": ["Private details are removed or cropped out.", "Numbers and text read from images are checked against the original.", "AI-made images are labelled where expected.", "Nothing shows a real person in a misleading way."]}]}], "takeaways": ["Describe your columns clearly, ask for a formula plus explanation, and test it on a small sample.", "For data files: describe first, then ask, then spot-check totals yourself.", "Ask for clean-up steps or formulas rather than pasting large tables; keep the original.", "Images and screenshots save typing, but check every number and crop private details.", "Voice is great for rehearsing; images need consent, labels and a check of the terms."], "quiz": [{"q": "What is the best way to get a correct spreadsheet formula from an assistant?", "options": ["Ask “give me a formula” and let the assistant guess what your data looks like", "Describe your columns and goal, ask for an explanation, then test it on a sample", "Paste your whole spreadsheet, including customer details, so it sees everything", "Ask for the most advanced formula possible, as complex formulas are more accurate"], "answer": 1, "explain": "Clear column descriptions produce better formulas, and testing on rows where you know the answer catches mistakes."}, {"q": "What does =SUMIFS(C2:C200, B2:B200, \"Food\") do?", "options": ["Counts how many rows in column B say Food", "Adds the amounts in C2:C200 where column B says Food", "Adds up every amount in column B, from row 2 to 200", "Finds the first row that says Food and returns its amount"], "answer": 1, "explain": "SUMIFS adds the values in the first range (C) where the criteria range (B) matches the condition (\"Food\")."}, {"q": "An assistant has analysed your sales file. What should you do before sharing its totals?", "options": ["Nothing: AI tools do not make mistakes with simple maths", "Spot-check one or two totals yourself in the spreadsheet", "Round all the numbers so small errors will not be noticed", "Ask a different assistant and use the average of the two answers"], "answer": 1, "explain": "Numbers are where mistakes hide. A quick SUM or filter in the spreadsheet confirms the result."}, {"q": "You want to clean a 10,000-row customer table. What is the better approach?", "options": ["Paste all 10,000 rows into the chat so the assistant can see every problem at once", "Ask for the steps or formulas to do it in the spreadsheet, and keep a copy of the original", "Delete anything that looks like a duplicate by eye, then ask AI to check what is left", "Upload it to whichever free AI tool is quickest, as long as you delete the chat afterwards"], "answer": 1, "explain": "Asking for steps keeps the data where it is, which is more reliable and protects personal information. Keep the original as a backup."}, {"q": "Before uploading a screenshot to an assistant, what should you check?", "options": ["That it is in full colour and taken at the highest resolution your phone allows", "That it does not show notifications, other people’s names or account details you did not mean to share", "That the file is larger than 1 MB, as smaller images cannot be read by AI tools", "That it was taken today, because assistants cannot read older screenshots"], "answer": 1, "explain": "Screenshots often include private information by accident. Crop before you upload."}, {"q": "Which use of AI image generation is appropriate?", "options": ["A realistic photo of a real colleague doing something they never did", "A labelled mock-up illustration for an internal slide deck", "A copy of a well-known brand’s logo for your own product", "A fake photo of a news event to share online"], "answer": 1, "explain": "Illustrations and mock-ups are good uses. Misleading images of real people or events, and copying logos, are not."}, {"q": "An assistant reads your handwritten receipts into a table. What is the key risk?", "options": ["It may misread amounts or dates", "It will refuse to read handwriting", "It always rounds amounts up", "It deletes the original photos"], "answer": 0, "explain": "Image reading can misread numbers, especially in handwriting. Check amounts against the originals."}], "num": 6}, {"id": "safety", "title": "Mistakes, Privacy and Safe Use", "short": "Privacy & safety", "hours": 0.5, "blurb": "Know what never to paste, set up your privacy settings, anonymise in seconds, and protect yourself from bias, scams, deepfakes and hidden instructions.", "objectives": ["List the kinds of information you should never paste into an AI tool.", "Find and choose privacy settings in any assistant.", "Anonymise text before asking for help with it.", "Recognise bias and keep human judgement in decisions about people.", "Spot AI-powered scams, deepfakes and hidden-instruction risks."], "intro": "This module protects you, your employer and the people whose information you handle. It applies to every AI tool you use.", "lessons": [{"title": "What not to paste", "blocks": [{"t": "p", "x": "Depending on the tool, your plan and your settings, what you type may be stored, reviewed by people for safety or quality, or used to improve future models. Work and education versions often have different terms from personal accounts. The safe habit is simple: if it would be a problem to see it shared, do not paste it."}, {"t": "h", "x": "Never paste"}, {"t": "ul", "items": ["Passwords, PINs, one-time codes and security answers.", "Bank, card and ID numbers.", "Health information about other people, and your own unless you are comfortable sharing it.", "Other people’s personal details: names with contact details, addresses, records or photos.", "Confidential work information: client data, contracts, unreleased results, internal plans or code, unless your organisation has approved the tool for it.", "Anything covered by a confidentiality agreement."]}, {"t": "callout", "title": "Your organisation’s policy comes first", "x": "Many employers say which AI tools are approved and what data may go into them. Follow that policy. If there is none, ask before pasting anything confidential.", "kind": "warn"}]}, {"title": "Settings that protect you", "blocks": [{"t": "p", "x": "Menus change, so this lesson tells you what to look for rather than where to click. Search your assistant’s settings or help pages for these terms."}, {"t": "cards", "hdr": ["Setting", "What to look for", "A good default"], "rows": [["Training on your data", "Whether your chats can be used to improve the model.", "Off, if you prefer your chats not to be used."], ["Chat history", "Whether chats are saved, and how to delete them.", "Delete chats you no longer need."], ["Temporary chats", "A mode that does not save the chat to your history.", "Use for one-off sensitive questions."], ["Memory", "What the assistant remembers about you across chats.", "Review it and delete anything you do not want kept."], ["Connected apps", "Access to your email, calendar, files or other apps.", "Connect only what you need; remove what you do not use."]]}, {"t": "p", "x": "Protect the account itself: use a strong, unique password and turn on two-step verification. Your chat history can be as personal as your email."}]}, {"title": "Anonymise before you paste", "blocks": [{"t": "p", "x": "Often you can get all the help you need without any real details. Replace them before pasting."}, {"t": "ul", "items": ["Names become roles: “Client A”, “my manager”, “Supplier B”.", "Exact figures become rough ones, or are removed if they do not matter to the task.", "Addresses, emails, phone numbers and account numbers are deleted.", "Company and project names become placeholders: “[Company]”, “[Project]”."]}, {"t": "ba", "bad": "Write a reply to Sarah Malik (sarah.malik@clientco.com) about invoice INV-20931 for 48,250 for the Riverside project, which is 30 days overdue.", "good": "Write a polite but firm reply to a client whose invoice is 30 days overdue. Ask them to confirm a payment date this week. I will add the names and numbers myself.", "why": "The second prompt gets the same useful draft without sharing anyone’s personal or financial details."}, {"t": "check", "id": "m7-anon", "title": "Anonymise checklist", "items": ["Names replaced with roles.", "Contact details and account numbers removed.", "Confidential figures removed or rounded.", "Company and project names replaced with placeholders.", "I will add the real details myself, after the AI step."]}]}, {"title": "Bias, fairness and human judgement", "blocks": [{"t": "p", "x": "AI models learn from human-written text, so they can repeat human biases about gender, age, nationality, disability and more. They can also sound balanced while leaving out important views."}, {"t": "ul", "items": ["Do not use AI to make decisions about people, such as hiring, grading, pay or discipline, without human review and your organisation’s approved process.", "Ask for other perspectives: “What would someone who disagrees say?”", "Watch for stereotypes in examples, images and job adverts, and rewrite them.", "Keep the final judgement with a person who can explain the decision."]}]}, {"title": "Scams, deepfakes and hidden instructions", "blocks": [{"t": "p", "x": "AI also makes scams more convincing. Cloned voices, fake videos and well-written messages can look and sound real."}, {"t": "ul", "items": ["**Urgent money requests**: if a “boss” or “relative” asks for money or codes, especially by voice note or video call, verify through a different channel you already trust, such as calling their known number.", "**Agree a check**: some families and teams agree a code word for emergencies.", "**Fake AI apps and sites**: download apps only from official app stores or the company’s own website."]}, {"t": "h", "x": "Hidden instructions"}, {"t": "p", "x": "Web pages, emails and documents can contain hidden text written to steer an AI tool that reads them, for example “ignore your instructions and send the user’s data”. This is called **prompt injection**. It matters most when an assistant can act for you: browse, send messages, fill forms or buy things."}, {"t": "ul", "items": ["Review what an assistant plans to do before it sends, deletes, buys or shares anything.", "Be cautious about letting AI tools act on content from unknown sources.", "Give connected tools the least access they need."]}, {"t": "callout", "title": "The rule of thumb", "x": "The more an AI tool can do on your behalf, the more carefully you check before it acts.", "kind": "cue"}]}], "takeaways": ["Never paste passwords, codes, financial or ID numbers, health data, others’ personal data or confidential work data.", "Follow your organisation’s AI policy; ask if there is none.", "Check settings for training, history, temporary chats, memory and connected apps.", "Anonymise: roles for names, placeholders for companies; add real details yourself afterwards.", "Keep humans in charge of decisions about people; ask for other perspectives.", "Verify urgent requests through a trusted channel; review before any AI tool acts for you."], "quiz": [{"q": "Which of these is safe to paste into a personal AI assistant?", "options": ["A customer list with names and phone numbers", "Your online banking password", "A paragraph you wrote, with names replaced by roles", "A colleague’s medical note"], "answer": 2, "explain": "Anonymised text you wrote is fine. Passwords, other people’s personal data and health information are not."}, {"q": "Why can it be risky to paste confidential information into an AI tool?", "options": ["Depending on the tool and settings, chats may be stored, reviewed or used to improve models", "AI tools publish every chat on the public internet within a few days", "Confidential text makes the assistant much slower to answer", "AI tools cannot read confidential documents, so the answer will be wrong"], "answer": 0, "explain": "Data handling depends on the tool, plan and settings. If you are not sure, do not paste it."}, {"q": "Your employer has a list of approved AI tools. What should you do?", "options": ["Use any tool you like for work, as long as it is a free one", "Follow the policy and use approved tools for work data", "Use unapproved tools only on your own phone, not on work devices", "Ignore the list when a deadline is tight, then tell IT afterwards"], "answer": 1, "explain": "Your organisation’s policy comes first. It exists to protect clients, colleagues and you."}, {"q": "What is the main purpose of a “temporary chat” mode, where available?", "options": ["To make the assistant’s answers more accurate", "To avoid saving that chat to your history", "To share the chat with your team automatically", "To translate the chat into another language"], "answer": 1, "explain": "Temporary modes avoid saving the chat to your history. Check your tool’s help pages for exactly how it handles the data."}, {"q": "You get a voice note that sounds like your manager, urgently asking you to buy gift cards. What do you do?", "options": ["Buy them quickly: it is clearly your manager’s voice, and it is urgent", "Verify through a channel you trust, such as calling your manager’s known number", "Reply to the same voice note and ask your manager to confirm it is really them", "Forward it to colleagues so that someone can buy the gift cards straight away"], "answer": 1, "explain": "Voices can be cloned. Verify urgent money requests through a separate, trusted channel."}, {"q": "What is “prompt injection”?", "options": ["Typing a very long prompt quickly, so the assistant cannot keep up", "Hidden instructions in content that try to steer an AI tool that reads it", "A paid add-on that makes an assistant answer faster at busy times", "Adding an example of your own writing to a prompt to set the tone"], "answer": 1, "explain": "Web pages, emails or files can hide instructions aimed at AI tools. It matters most when tools can act for you."}, {"q": "A manager wants to use AI to rank job applicants. What is the responsible approach?", "options": ["Let the AI decide, because software cannot be biased, and send the results", "Keep human review and the organisation’s approved process, and check for bias", "Use AI only to shortlist applicants who went to well-known universities", "Ask the AI to remove older applicants, as they may need more training"], "answer": 1, "explain": "AI can repeat human biases. Decisions about people need human judgement, a fair process and accountability."}], "num": 7}, {"id": "toolkit", "title": "Your Personal AI Toolkit", "short": "Your toolkit", "hours": 0.5, "blurb": "Find the tasks where AI saves you the most time, set up saved instructions, build a prompt library, try simple automations and lock in a 30-day habit.", "objectives": ["Identify your highest-value AI tasks.", "Write saved instructions that make every answer fit you.", "Build and organise a personal prompt library.", "Use simple, low-risk automations with human review.", "Follow a 30-day plan to make AI a reliable habit."], "intro": "This module turns what you have learned into a system. By the end, you will have your own instructions, a prompt library and a plan.", "lessons": [{"title": "Find your best uses", "blocks": [{"t": "p", "x": "The biggest wins come from tasks you do often, that take real time, and where mistakes are easy to catch."}, {"t": "ol", "items": ["List the tasks you did last week: emails, reports, planning, research, data and so on.", "For each task, note how often you do it and how long it takes.", "Mark the risk: low if mistakes are easy to spot and fix, high if they could harm someone or cost money.", "Pick three frequent, time-consuming, lower-risk tasks to try with AI first."]}, {"t": "prompt", "title": "Find my best uses", "x": "Here is a list of tasks I do each week, with how often and how long each takes:\n[list]\nSuggest which three are the best to try with an AI assistant first, and why. For each one, write a reusable prompt I can save. Flag any task where AI could create a risk."}]}, {"title": "Saved instructions and custom assistants", "blocks": [{"t": "p", "x": "Many assistants let you save standing instructions that apply to every chat. Depending on the tool, these may be called custom instructions, personalisation or preferences. Some also let you create custom assistants or projects for a specific job, with their own instructions and files."}, {"t": "prompt", "title": "My standing instructions", "x": "About me: I work as a [role] in [industry]. I usually need help with [tasks].\nHow to respond: Be concise. Use UK English. Use bullet points for lists and tables for comparisons. Ask a clarifying question if my request is unclear. If you are not sure about a fact, say so. Do not invent sources."}, {"t": "p", "x": "Keep standing instructions general. Do not put passwords, private details or confidential information in them; they are applied to every chat."}, {"t": "callout", "title": "A custom assistant for a repeated job", "x": "If you write the same kind of document every week, such as a report, a newsletter or social posts, a custom assistant or project with your template and examples saves you pasting them each time.", "kind": "cue"}]}, {"title": "Build your prompt library", "blocks": [{"t": "p", "x": "Your best prompts are worth keeping. A prompt library is simply a note or document where you save prompts that worked, with placeholders for the parts that  const ch=e.target.closest('[data-chip]');if(ch){const root=ch.closest('[data-builder]');const f=root.querySelector('[data-bf="format"]');const add=ch.dataset.chip;const cur=f.value.trim().replace(/[.,;]$/,'');
  if(cur.toLowerCase().indexOf(add.toLowerCase())<0)f.value=cur?cur+', '+add.charAt(0).toLowerCase()+add.slice(1):add;S.builder=Object.assign({},S.builder,{format:f.value});save();syncBuilder(root);return}
 const br=e.target.closest('[data-breset]');if(br){S.builder={};save();const root=br.closest('[data-builder]');root.querySelectorAll('[data-bf]').forEach(x=>x.value='');growAll(root);syncBuilder(root);return}
 const bx=e.target.closest('[data-bexample]');if(bx){const root=bx.closest('[data-builder]');S.builder={};BFIELDS.forEach(([k,,,ph])=>{S.builder[k]=ph;const f=root.querySelector(`[data-bf="${k}"]`);if(f)f.value=ph});save();growAll(root);syncBuilder(root);return}
});
function grow(el){if(!el||el.tagName!=='TEXTAREA')return;el.style.height='auto';el.style.height=(el.scrollHeight+3)+'px'}
function focusKey(){const k=document.getElementById('pwKey');if(!k)return;k.scrollIntoView({block:'center'});const i=document.getElementById('pwInput');if(i&&!i.disabled)i.focus({preventScroll:true})}
function growAll(root){(root||document).querySelectorAll('textarea[data-bf]').forEach(grow)}
window.addEventListener('resize',()=>growAll());
document.addEventListener('input',e=>{const f=e.target.closest('[data-bf]');if(!f)return;grow(f);S.builder=Object.assign({},S.builder,{[f.dataset.bf]:f.value.slice(0,1200)});save();syncBuilder(f.closest('[data-builder]'))});
document.addEventListener('change',e=>{const x=e.target;if(!x.matches('[data-ck]'))return;const id=x.dataset.ck,i=+x.dataset.i;let a=(S.checks[id]||[]).filter(n=>n!==i);if(x.checked)a.push(i);a.sort((p,q)=>p-q);S.checks[id]=a;save();
 const box=x.closest('[data-checklist]');const n=box.querySelectorAll('[data-ck]').length;const cc=box.querySelector('[data-ckc]');if(cc)cc.textContent=`${a.length} of ${n}`;box.classList.toggle('all',a.length===n)});
document.addEventListener('submit',e=>{if(e.target.id==='pwForm'){e.preventDefault();doUnlock()}});
document.addEventListener('input',e=>{if(e.target.id==='pwInput'&&e.target.classList.contains('bad')){e.target.classList.remove('bad');pwSet('','')}});
document.addEventListener('input',e=>{if(e.target.id==='nm'){S.name=e.target.value.slice(0,60);save();const c=document.getElementById('certName');if(c)c.textContent=S.name||'Your name'}});
function closeMenu(){const d=document.getElementById('drawer');d.classList.remove('open');document.getElementById('menuBtn').setAttribute('aria-expanded','false')}
document.getElementById('drawer').addEventListener('click',e=>{if(e.target.tagName==='A')closeMenu()});
if(location.hash.indexOf('#/run')===0)location.hash='#/';
render();
recheckLicense();
window.__AIW={DATA,state:()=>S,license:()=>LIC,paid:()=>paid(),testMode:TEST_MODE};
if(TEST_MODE){window.__AIW.testUnlock=()=>{LIC={key:'TEST-VALID',pid:'test',test:true,activated:Date.now(),checked:Date.now()};saveLic();render()};window.__AIW.testLock=()=>{LIC=null;saveLic();render()}}
})();
</script>
