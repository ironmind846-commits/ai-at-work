<title>AI at Work: Everyday AI Assistant Skills · by Course King</title>
<meta name="description" content="AI at Work by Course King: a self-paced online course in everyday AI assistant skills. Prompting, writing, research and fact-checking, planning, spreadsheets, privacy and your own AI toolkit, with a test at the end of every module and a certificate of completion (not an accredited qualification).">
<style>
:root{--ink:#14201B;--ink2:#1E2E27;--cream:#F4EEE1;--paper:#FBF8F1;--gold:#C8A96A;--gold-d:#9C7F43;--line:rgba(20,32,27,.13);--muted:#56625C;--ok:#2E6B4E;--ok-bg:#E3EFE7;--bad:#9A3B2E;--bad-bg:#F6E3DE;--warn-bg:#F7EBD3;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;overflow-wrap:break-word;word-wrap:break-word}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.2;margin:0 0 .5em;font-weight:700;overflow-wrap:break-word;hyphens:auto}
h1{font-size:clamp(2rem,7vw,3.2rem);letter-spacing:-.01em}
h2{font-size:clamp(1.45rem,4.6vw,2rem)}
h3{font-size:1.2rem}
p{margin:0 0 1em}
a{color:inherit}
button{font:inherit;color:inherit}
img,svg{max-width:100%}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:0 18px}
.wide{max-width:1120px}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--cream);border-bottom:1px solid rgba(200,169,106,.35)}
.top .bar{display:flex;align-items:center;gap:12px;min-height:58px;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0;flex:1}
.mono{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--gold);font-size:.95rem}
.brand-txt{min-width:0;line-height:1.15}
.brand-txt b{display:block;font-family:var(--serif);font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{flex:0 0 auto;background:transparent;border:1px solid rgba(244,238,225,.35);border-radius:999px;padding:7px 14px;color:var(--cream);cursor:pointer;font-size:.9rem}
.menu-btn:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
nav.drawer{display:none;border-top:1px solid rgba(244,238,225,.12);padding:6px 0 12px}
nav.drawer.open{display:block}
nav.drawer a,nav.drawer button{display:block;width:100%;text-align:left;padding:11px 2px;text-decoration:none;color:var(--cream);background:none;border:0;border-bottom:1px solid rgba(244,238,225,.08);cursor:pointer;font-size:1rem}
nav.drawer button.danger{color:#E9B8AE}
/* hero */
.hero{background:radial-gradient(1200px 400px at 85% -10%,rgba(200,169,106,.22),transparent 60%),var(--ink);color:var(--cream);padding:42px 0 46px}
.eyebrow{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:12px}
.byline{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:1.12rem;margin:-4px 0 18px}
.hero p.lead{font-size:1.08rem;color:rgba(244,238,225,.88);max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 24px;padding:0;list-style:none}
.chips li{border:1px solid rgba(200,169,106,.5);border-radius:999px;padding:5px 12px;font-size:.86rem;color:var(--cream)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--cream);text-decoration:none;cursor:pointer;font-weight:600;text-align:center;max-width:100%}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.hero .btn.ghost{color:var(--cream);border-color:rgba(244,238,225,.5)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.btn-row .btn{flex:1 1 180px}
.meter{height:8px;border-radius:999px;background:rgba(20,32,27,.12);overflow:hidden}
.hero .meter{background:rgba(244,238,225,.15)}
.meter i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .4s}
.meter-label{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:.86rem;margin:0 0 6px}
section.block{padding:38px 0 8px}
.section-head{margin-bottom:18px}
.section-head p{color:var(--muted);max-width:62ch}
/* module grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
a.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
a.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(20,32,27,.45)}
.mcard-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.num{font-family:var(--serif);font-size:.9rem;color:var(--gold-d);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.badge{font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 10px;background:rgba(20,32,27,.07);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.prog{background:var(--warn-bg);color:#7A5A1E}
.card h3{margin-bottom:6px}
.card p.blurb{color:var(--muted);font-size:.95rem;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted);margin:6px 0 12px}
.dark-card,a.card.dark-card{background:var(--ink);color:var(--cream);border-color:var(--ink)}
#app{flex:1 0 auto}
.dark-card p.blurb{color:rgba(244,238,225,.8)}
.dark-card .num{color:var(--gold)}
/* rules */
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px;margin:0;padding:0;list-style:none}
.rules li{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:14px 16px;min-width:0}
.rules b.big{display:block;font-family:var(--serif);font-size:1.6rem;line-height:1.1;color:var(--ink)}
.rules span{display:block;font-size:.92rem;color:var(--muted)}
/* page header */
.phead{background:var(--ink);color:var(--cream);padding:28px 0 30px}
.phead .crumbs{font-size:.84rem;color:var(--gold);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px}
.phead .crumbs a{color:var(--gold)}
.phead p{color:rgba(244,238,225,.85)}
.phead h1{font-size:clamp(1.7rem,6vw,2.6rem)}
.phead .meter{background:rgba(244,238,225,.15);margin-top:14px}
main{padding-bottom:40px}
.content{padding-top:26px}
.content h2{margin-top:1.4em}
.content h3.sub{font-family:var(--sans);font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-d);margin:1.8em 0 .7em}
ul.clean,ol.clean{padding-left:1.2em;margin:0 0 1.2em}
ul.clean li,ol.clean li{margin-bottom:.55em;padding-left:.2em}
ul.clean li::marker{color:var(--gold-d)}
ol.clean li::marker{color:var(--gold-d);font-weight:700}
.objectives{list-style:none;padding:0;margin:0 0 10px}
.objectives li{position:relative;padding:10px 0 10px 34px;border-bottom:1px solid var(--line)}
.objectives li::before{content:"";position:absolute;left:4px;top:15px;width:16px;height:16px;border-radius:50%;border:2px solid var(--gold)}
.lesson-list{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:8px}
.lesson-list a{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;text-decoration:none;min-width:0}
.lesson-list .n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:700;background:rgba(20,32,27,.07)}
.lesson-list .seen .n{background:var(--ok);color:#fff}
.lesson-list .t{flex:1;min-width:0}
.lesson-list .go{flex:0 0 auto;color:var(--gold-d);font-weight:700}
.lesson-list .special{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.lesson-list .special .n{background:var(--gold);color:var(--ink)}
.lesson-list .special .go{color:var(--gold)}
.lesson-list .special .t small{display:block;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:2px}
.lesson-list .practice{background:transparent;border-style:dashed}
.card.locked{opacity:.66}
.badge.lock{background:rgba(20,32,27,.07);color:var(--muted)}
.test-end{background:var(--ink);color:var(--cream);border-radius:18px;padding:20px;margin:18px 0 8px}
.test-end .eb{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700}
.test-end h3{color:var(--cream);margin:.25em 0 .35em}
.test-end p{margin:0 0 14px;color:rgba(244,238,225,.85)}
.cert .c-note{font-size:.78rem;line-height:1.5;color:#4A554F;max-width:560px;margin:22px auto 0;padding-top:12px;border-top:1px solid var(--gold);font-style:italic}
.cert .c-note b{font-style:normal;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;color:var(--gold-d);display:block;margin-bottom:2px}
.notice{background:var(--paper);border:1px solid var(--gold);border-radius:14px;padding:14px 16px;margin:16px 0 0}
.notice b{display:block;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-d);margin-bottom:4px}
.notice p{margin:0;font-size:.95rem}
/* lesson blocks */
.callout{border-radius:14px;padding:14px 16px;margin:0 0 1.2em;background:#EFE6D2;border-left:4px solid var(--gold)}
.callout.warn{background:var(--bad-bg);border-left-color:var(--bad)}
.callout.cue{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--ink)}
.callout b.ct{display:block;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.callout p{margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px;margin:0 0 1.4em}
.tcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.tcard h4{font-family:var(--sans);font-size:1rem;margin:0 0 8px;color:var(--ink)}
.tcard .hlabel{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-d);font-weight:700;margin-bottom:2px}
.tcard dl{margin:0}
.tcard dt{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:10px}
.tcard dd{margin:2px 0 0;font-size:.95rem}
figure.fig{margin:0 0 1.4em;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
figure.fig svg{display:block;width:100%;height:auto}
figure.fig figcaption{font-size:.88rem;color:var(--muted);margin-top:10px}
.fig-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-top:12px;font-size:.88rem}
.fig-legend div{min-width:0}
.fig-legend b{display:block}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ticks{display:grid;grid-template-columns:25% 35% 1fr auto;font-size:.76rem;color:var(--muted);margin-top:4px}
.flow{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.flow li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--cream);min-width:0}
.flow li b.step{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--gold);font-size:.85rem}
.flow li div{min-width:0}
.pager{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
.pager .btn{flex:1 1 160px}
.takeaways{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:10px;counter-reset:t}
.takeaways li{counter-increment:t;display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.takeaways li::before{content:counter(t);flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--ink);font-weight:700;font-size:.85rem}
/* quiz */
.qhead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--muted);margin-bottom:8px}
.qstem{font-family:var(--serif);font-size:1.28rem;line-height:1.35;margin:14px 0 18px}
.opts{display:grid;gap:10px;margin-bottom:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;line-height:1.45;min-width:0}
.opt .l{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:rgba(20,32,27,.07)}
.opt .tx{flex:1;min-width:0}
.opt:hover:not([disabled]){border-color:var(--gold)}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.sel .l{background:var(--ink);color:var(--cream)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:14px 16px;margin-bottom:16px}
.fb.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.fb.no{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fb.neutral{background:#EFE6D2;border-left:4px solid var(--gold)}
.fb b{display:block;margin-bottom:4px}
.fb p{margin:0}
textarea{width:100%;min-height:120px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:12px 14px;font:inherit;font-size:1rem;resize:vertical;margin-bottom:12px}
input[type=text]{width:100%;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:12px 14px;font:inherit;min-height:48px}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:10px 0 18px}
.ring{flex:0 0 auto;width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:1.9rem;font-weight:700}
.ring.pass{background:conic-gradient(var(--ok) var(--p),rgba(20,32,27,.1) 0)}
.ring.fail{background:conic-gradient(var(--bad) var(--p),rgba(20,32,27,.1) 0)}
.ring span{width:84px;height:84px;border-radius:50%;background:var(--cream);display:grid;place-items:center}
.score > div:not(.ring){min-width:0;flex:1 1 200px}
.review{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.review li{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.review .rq{font-weight:600;margin-bottom:6px}
.review .ra{font-size:.94rem}
.review .ok{color:var(--ok);font-weight:700}
.review .no{color:var(--bad);font-weight:700}
.toggle{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;cursor:pointer}
.toggle input{width:22px;height:22px;flex:0 0 auto;margin-top:2px;accent-color:var(--ink)}
.timer{position:sticky;top:58px;z-index:10;background:var(--gold);color:var(--ink);font-weight:700;text-align:center;padding:6px 10px;font-size:.92rem}
.timer.low{background:var(--bad);color:#fff}
.selfmark{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.selfmark .btn{flex:1 1 120px}
/* checklist */
.check{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:8px}
.check li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--paper);border:1px solid var(--line);min-width:0}
.check li i{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.8rem;background:rgba(20,32,27,.1)}
.check li.done i{background:var(--ok);color:#fff}
.check li div{min-width:0;flex:1}
/* certificate */
.cert{background:#FFFDF8;color:var(--ink);border-radius:6px;padding:10px;margin:20px 0;box-shadow:0 20px 40px -24px rgba(20,32,27,.5)}
.cert-in{border:2px solid var(--gold);outline:1px solid var(--gold);outline-offset:-8px;padding:clamp(22px,6vw,56px) clamp(16px,5vw,48px);text-align:center}
.cert .mono{margin:0 auto 14px;width:54px;height:54px;font-size:1.3rem;color:var(--gold-d);border-color:var(--gold-d)}
.cert .c-eyebrow{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-d);font-weight:700}
.cert h2{font-size:clamp(1.6rem,6vw,2.6rem);margin:.3em 0 .4em}
.cert .c-name{font-family:var(--serif);font-size:clamp(1.6rem,7vw,2.6rem);font-style:italic;border-bottom:1px solid var(--gold);display:inline-block;padding:0 12px 4px;margin:6px 0 14px;max-width:100%}
.cert .c-course{font-family:var(--serif);font-weight:700;font-size:1.15rem}
.cert .c-foot{display:flex;flex-wrap:wrap;justify-content:space-around;gap:16px;margin-top:28px;font-size:.9rem}
.cert .c-foot div{min-width:140px}
.cert .c-foot b{display:block;font-family:var(--serif);font-size:1.05rem;border-top:1px solid var(--line);padding-top:6px}
footer.foot{background:var(--ink);color:rgba(244,238,225,.75);padding:26px 0 34px;font-size:.9rem;margin-top:30px}
footer.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== about Course King ===== */
.about-ck{padding:38px 0 8px}
.about-panel{display:grid;gap:22px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,28px);align-items:center}
.about-panel{border-left:4px solid var(--gold)}
.about-id{display:flex;align-items:center;gap:14px;margin-bottom:14px;min-width:0}
.about-id > div{min-width:0}
.about-id h2{margin:0}
.about-id .eyebrow{margin-bottom:4px}
.about-mono{flex:0 0 auto;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--gold);border:2px solid var(--gold);font-family:var(--serif);font-weight:700;font-size:1.2rem;letter-spacing:.02em}
.about-copy p{max-width:68ch}
.about-photo{margin:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--ink);aspect-ratio:4/5;max-width:280px}
.about-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 18%}
.about-copy .eyebrow{color:var(--gold-d);margin-bottom:8px}
.about-copy h2{margin-bottom:.35em}
.about-copy .tagline{font-family:var(--serif);font-style:italic;color:var(--gold-d);font-size:1.15rem;margin:0 0 14px}
.about-copy p{color:var(--muted);max-width:58ch}
.about-copy p:last-child{margin-bottom:0}
.about-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.about-page .about-hero{display:grid;gap:22px;margin:22px 0 8px}
.about-page .about-hero{max-width:720px}
.about-page .about-photo{max-width:100%}
/* ===== live session ===== */
.live{background:linear-gradient(180deg,var(--cream),var(--paper))}
.live-panel{display:grid;gap:26px;background:var(--ink);color:var(--cream);border-radius:24px;padding:clamp(22px,5vw,44px);position:relative;overflow:hidden;background-image:radial-gradient(640px 300px at 100% 0,rgba(200,169,106,.26),transparent 62%),radial-gradient(420px 260px at 0 100%,rgba(200,169,106,.12),transparent 60%)}
.live-panel h2{color:var(--cream);font-size:clamp(1.6rem,5.4vw,2.4rem);margin-bottom:.4em}
.live-panel .eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.live-panel .eyebrow .ic{width:1.3em;height:1.3em}
.live-panel p.lede{color:rgba(244,238,225,.88);font-size:1.06rem;max-width:56ch}
.live-points{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.live-points li{display:flex;gap:12px;align-items:flex-start;background:rgba(244,238,225,.06);border:1px solid rgba(200,169,106,.28);border-radius:16px;padding:14px 16px;min-width:0}
.live-points li > div{min-width:0}
.live-points .lp-ic{flex:0 0 auto;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(200,169,106,.18);color:var(--gold)}
.live-points .lp-ic svg{width:20px;height:20px}
.live-points b{display:block;color:var(--cream);margin-bottom:2px}
.live-points span.d{display:block;font-size:.92rem;color:rgba(244,238,225,.75)}
@media (min-width:900px){.live-points{grid-template-columns:repeat(3,minmax(0,1fr))}}
.live-cta{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.live-cta .btn{flex:0 1 auto;min-width:min(100%,240px)}
.live-panel .btn.ghost{color:var(--cream);border-color:rgba(244,238,225,.5)}
.book-note{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--gold);margin:0}
.book-note .ic{width:1em;height:1em}
.book-note.pulse{animation:pulse .6s ease-out}
@keyframes pulse{0%{opacity:.3}100%{opacity:1}}
.live-fine{font-size:.82rem;color:rgba(244,238,225,.62);margin:0;max-width:70ch}
.content .live-points li{background:var(--paper);border-color:var(--line)}
.content .live-points b{color:var(--ink)}
.content .live-points span.d{color:var(--muted)}
.content .live-points .lp-ic{background:var(--sand);color:var(--ink)}
.book-box{background:var(--ink);color:var(--cream);border-radius:20px;padding:22px;margin:22px 0 6px;background-image:radial-gradient(500px 220px at 100% 0,rgba(200,169,106,.24),transparent 60%)}
.book-box h3{color:var(--cream);margin:.2em 0 .35em}
.book-box p{color:rgba(244,238,225,.85)}
.book-box .eb{display:flex;align-items:center;gap:8px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.cert-cta{margin-top:26px}
.cert-cta h2{color:var(--cream);font-size:clamp(1.45rem,5vw,2rem);margin:.25em 0 .4em}
.hero-card .hc-live{display:flex;align-items:center;gap:10px;margin:14px 0 0;padding:12px 14px;border-radius:14px;background:rgba(200,169,106,.16);border:1px solid rgba(200,169,106,.45);color:var(--cream);text-decoration:none;font-weight:600;font-size:.95rem;transition:background-color .18s}
.hero-card .hc-live:hover{background:rgba(200,169,106,.26)}
.hero-card .hc-live .ic{color:var(--gold);width:1.25em;height:1.25em}
.hero-card .hc-live span{flex:1;min-width:0}
/* ===== design polish ===== */
:root{--sand:#E9DFC9;--shadow:0 18px 40px -26px rgba(20,32,27,.55);--r-lg:20px;--r-md:14px}
.ic{width:1.05em;height:1.05em;flex:0 0 auto;vertical-align:-.16em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{transition:background-color .18s,border-color .18s,color .18s,transform .18s,box-shadow .18s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(20,32,27,.6)}
.btn.gold:hover{background:#D4B87D;border-color:#D4B87D}
.btn .ic{width:1.1em;height:1.1em}
main.enter{animation:enter .32s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* hero */
.hero{position:relative;overflow:hidden;padding:46px 0 50px;background:radial-gradient(900px 420px at 92% -12%,rgba(200,169,106,.26),transparent 62%),radial-gradient(700px 380px at -10% 110%,rgba(200,169,106,.10),transparent 60%),var(--ink)}
.hero-grid{display:grid;gap:30px;align-items:center}
.hero h1{font-size:clamp(2.3rem,9vw,4rem);letter-spacing:-.015em;margin-bottom:.25em}
.hero .byline{font-size:clamp(1.05rem,3.6vw,1.3rem);margin:0 0 18px}
.hero p.lead{font-size:clamp(1.06rem,3.4vw,1.22rem);line-height:1.55;margin-bottom:22px;max-width:44ch}
.hero .rule{width:56px;height:2px;background:var(--gold);margin:0 0 18px;border:0}
.hero-progress{max-width:520px;margin-bottom:20px}
.hero .btn-row{max-width:520px}
.hero-card{background:linear-gradient(160deg,rgba(244,238,225,.07),rgba(244,238,225,.02));border:1px solid rgba(200,169,106,.38);border-radius:var(--r-lg);padding:22px;min-width:0}
.hero-card .hc-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.hero-card .hc-head svg{width:52px;height:52px;flex:0 0 auto}
.hero-card .hc-head b{display:block;font-family:var(--serif);font-size:1.15rem;color:var(--cream)}
.hero-card .hc-head span{display:block;font-size:.82rem;color:rgba(244,238,225,.7)}
.hc-stats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hc-stats li{border-top:1px solid rgba(200,169,106,.3);padding-top:10px;min-width:0}
.hc-stats b{display:block;font-family:var(--serif);font-size:1.6rem;line-height:1.1;color:var(--gold)}
.hc-stats span{display:block;font-size:.84rem;color:rgba(244,238,225,.78)}
.hero-card .hc-note{margin:16px 0 0;font-size:.82rem;line-height:1.5;color:rgba(244,238,225,.7);display:flex;gap:8px}
.hero-card .hc-note .ic{color:var(--gold);margin-top:2px}
@media (min-width:900px){.hero{padding:76px 0 80px}.hero-grid{grid-template-columns:minmax(0,1.35fr) minmax(0,.9fr);gap:56px}}
/* section heads */
section.block{padding:52px 0 10px}
.section-head{margin-bottom:24px}
.section-head .eyebrow{margin-bottom:8px}
.section-head h2{margin-bottom:.35em}
/* module cards */
.grid{gap:18px}
a.card.mcard{position:relative;padding:22px 22px 18px;border-radius:var(--r-lg);transition:transform .2s,box-shadow .2s,border-color .2s}
a.card.mcard:hover{border-color:rgba(200,169,106,.7)}
.mcard .mnum{font-family:var(--serif);font-size:2.3rem;line-height:1;font-weight:700;color:var(--gold);letter-spacing:-.02em}
.mcard .num{display:block;margin:4px 0 6px;font-size:.78rem}
.mcard h3{font-size:1.22rem}
.mcard .meta{gap:6px 14px;margin:8px 0 14px}
.mcard .meta span{display:inline-flex;align-items:center;gap:5px}
.mcard .meta .ic{color:var(--gold-d)}
.mcard .mfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:5px}
.badge .ic{width:.95em;height:.95em}
.card.locked{opacity:1;background:rgba(251,248,241,.55)}
.card.locked .mnum{color:rgba(156,127,67,.45)}
.card.locked h3,.card.locked .blurb{color:#7C857F}
.card.locked .meter{opacity:.45}
.dark-card{position:relative;overflow:hidden}
.dark-card::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(200,169,106,.25);pointer-events:none}
.xcard .xic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sand);color:var(--ink);margin-bottom:12px}
.dark-card .xic{background:rgba(200,169,106,.18);color:var(--gold)}
.xcard .xic svg{width:22px;height:22px}
/* rules */
.rules li{border-radius:var(--r-md);padding:16px 18px}
.notice{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-md);padding:16px 18px;background:linear-gradient(180deg,#FFFDF8,var(--paper))}
.notice > svg{width:26px;height:26px;flex:0 0 auto;color:var(--gold-d);margin-top:1px}
.notice > div{min-width:0}
/* page header */
.phead{position:relative;overflow:hidden;background:radial-gradient(700px 260px at 100% 0,rgba(200,169,106,.18),transparent 60%),var(--ink);padding:30px 0 32px}
.phead .crumbs a{text-decoration:none;border-bottom:1px solid rgba(200,169,106,.4)}
/* lesson reading */
.reading{max-width:720px}
.reading > p,.reading ul.clean,.reading ol.clean{font-size:1.04rem;line-height:1.75}
.reading > p{margin-bottom:1.15em}
.reading h3.sub{margin-top:2.2em}
.lesson-kicker{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:rgba(244,238,225,.75);margin-top:-2px}
.lesson-kicker span{display:inline-flex;align-items:center;gap:6px}
.lesson-kicker .ic{color:var(--gold)}
/* callouts */
.callout{border-radius:var(--r-md);padding:16px 18px;background:#F1E8D5}
.callout b.ct{display:flex;align-items:center;gap:8px;color:var(--ink)}
.callout b.ct .ic{color:var(--gold-d);width:1.25em;height:1.25em}
.callout.warn b.ct .ic{color:var(--bad)}
/* table cards */
.tcard{border-radius:var(--r-md);padding:0;overflow:hidden;box-shadow:0 1px 0 rgba(20,32,27,.04)}
.tcard .th{background:var(--ink);color:var(--cream);padding:12px 16px}
.tcard .th .hlabel{color:var(--gold)}
.tcard h4{color:var(--cream);font-family:var(--serif);font-size:1.06rem;margin:0}
.tcard dl{padding:4px 16px 14px}
.tcard dt{color:var(--gold-d)}
.tcard dd{line-height:1.55}
.tcard dd + dt{border-top:1px solid var(--line);padding-top:10px}
/* lesson list */
.lesson-list a{transition:border-color .18s,background-color .18s,transform .18s}
.lesson-list a:hover{border-color:rgba(200,169,106,.75)}
.lesson-list .n .ic{width:15px;height:15px}
.lesson-list .go .ic{width:18px;height:18px}
.lesson-list .special{padding:16px;box-shadow:var(--shadow)}
/* module test intro + end panel */
.test-end{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:24px;background:radial-gradient(500px 200px at 100% 0,rgba(200,169,106,.22),transparent 60%),var(--ink)}
.test-end .eb{display:flex;align-items:center;gap:8px}
.test-hero{border-radius:var(--r-lg);background:var(--paper);border:1px solid var(--line);padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}
.tstats{list-style:none;margin:0 0 16px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.tstats li{background:var(--cream);border-radius:var(--r-md);padding:14px 16px;min-width:0}
.tstats .ic{color:var(--gold-d);width:22px;height:22px;display:block;margin-bottom:6px}
.tstats b{display:block;font-family:var(--serif);font-size:1.5rem;line-height:1.1}
.tstats span{display:block;font-size:.86rem;color:var(--muted)}
.test-hero p{margin:0 0 4px}
/* results */
.result-card{border-radius:var(--r-lg);padding:24px;margin:8px 0 18px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.result-card.pass{background:radial-gradient(500px 220px at 100% 0,rgba(200,169,106,.25),transparent 60%),#FFFDF8;border-color:rgba(200,169,106,.6)}
.result-card .rc-eb{display:flex;align-items:center;gap:8px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold-d);margin-bottom:6px}
.result-card.fail .rc-eb{color:var(--bad)}
.result-card h2{margin:0 0 .3em}
.result-card .score{margin:14px 0 0}
.ring{width:118px;height:118px}
.ring span{width:90px;height:90px;background:#FFFDF8}
.result-card .btn-row{margin-top:18px}
/* quiz */
.opt{transition:border-color .15s,background-color .15s,box-shadow .15s}
.qstem{font-size:clamp(1.2rem,4.2vw,1.42rem)}
/* certificate */
.cert{padding:12px;border-radius:8px;background:#FFFDF8;box-shadow:0 30px 60px -30px rgba(20,32,27,.55)}
.cert-in{position:relative;border:2px solid var(--gold);outline:1px solid var(--gold);outline-offset:-9px;background:radial-gradient(600px 300px at 50% 0,rgba(200,169,106,.12),transparent 70%);padding:clamp(30px,7vw,60px) clamp(18px,6vw,56px)}
.cert .corner{position:absolute;width:clamp(26px,6vw,44px);height:clamp(26px,6vw,44px);color:var(--gold-d)}
.cert .corner.tl{top:14px;left:14px}.cert .corner.tr{top:14px;right:14px;transform:scaleX(-1)}
.cert .corner.bl{bottom:14px;left:14px;transform:scaleY(-1)}.cert .corner.br{bottom:14px;right:14px;transform:scale(-1,-1)}
.cert-in{padding-bottom:clamp(54px,9vw,66px)}
.cert .seal{display:block;width:clamp(58px,15vw,78px);height:auto;margin:0 auto 12px}
.cert .c-kicker{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-d);font-weight:700}
.cert h2{font-size:clamp(1.7rem,6.4vw,2.8rem);margin:.25em 0 .55em;letter-spacing:.01em}
.cert .c-to{font-size:.86rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.cert .c-name{margin:8px 0 16px}
.cert .c-body{max-width:520px;margin:0 auto 6px}
.cert .c-foot div{min-width:150px}
.congrats{display:flex;align-items:center;gap:14px}
.congrats svg{width:48px;height:48px;flex:0 0 auto}
.congrats > div{min-width:0}
/* ===== paywall ===== */
.pw-done{display:flex;gap:10px;align-items:center;background:var(--ok-bg);color:var(--ok);border-radius:var(--r-md);padding:12px 16px;margin:0 0 16px;font-weight:600}
.pw-done span{min-width:0}
.pw-card{position:relative;overflow:hidden;background:radial-gradient(520px 240px at 100% 0,rgba(200,169,106,.26),transparent 60%),var(--ink);color:var(--cream);border-radius:var(--r-lg);padding:24px 22px;margin:0 0 18px;box-shadow:var(--shadow)}
.pw-card .eb{display:flex;align-items:center;gap:8px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.pw-card h2{color:var(--cream);margin:.35em 0 .7em}
.pw-list{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:12px}
.pw-list li{display:flex;gap:12px;align-items:flex-start;min-width:0}
.pw-list .pi{flex:0 0 auto;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(200,169,106,.18);color:var(--gold)}
.pw-list .pi .ic{width:19px;height:19px}
.pw-list .pt{min-width:0;color:rgba(244,238,225,.85);font-size:.98rem;line-height:1.5;padding-top:6px}
.pw-list .pt b{color:var(--cream)}
.pw-buy{width:100%;max-width:400px}
.pw-card .pw-have{width:100%;max-width:400px;margin-top:12px;color:var(--cream);border-color:rgba(244,238,225,.5)}
.pw-price{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 2px}
.pw-price .now{font-family:var(--serif);font-size:2.4rem;line-height:1.1;font-weight:700;color:var(--cream)}
.pw-price .was{font-size:1.2rem;color:rgba(244,238,225,.6);text-decoration-thickness:2px}
.pw-price .tagl{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink);background:var(--gold);border-radius:999px;padding:3px 10px;line-height:1.4}
.pw-once{font-size:.88rem;color:rgba(244,238,225,.72);margin:0 0 14px}
.pw-bundle{margin:20px 0 0;padding:16px 18px;border-radius:var(--r-md);border:1px solid rgba(200,169,106,.45);background:rgba(244,238,225,.06)}
.pw-bundle .pb-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin-bottom:6px}
.pw-bundle .pb-eb{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--cream);min-width:0}
.pw-bundle .pb-eb .ic{color:var(--gold)}
.pw-bundle .pb-price{font-family:var(--serif);font-size:1.5rem;font-weight:700;color:var(--gold)}
.pw-bundle p{font-size:.92rem;color:rgba(244,238,225,.8);margin:0 0 12px}
.pw-bundle p:last-child{margin:0}
.pw-bundle .btn.ghost{color:var(--cream);border-color:rgba(244,238,225,.5);width:100%;max-width:400px}
.pw-buy.is-soon{cursor:default;background:rgba(200,169,106,.2);border-color:rgba(200,169,106,.55);color:var(--cream)}
.pw-buy.is-soon:hover{background:rgba(200,169,106,.2);border-color:rgba(200,169,106,.55)}
.pw-note{font-size:.86rem;color:rgba(244,238,225,.72);margin:10px 0 0;max-width:60ch}
.pw-key{background:#FFFDF8;border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;margin:0 0 18px;box-shadow:var(--shadow)}
.pw-key h3{margin:0 0 .3em}
.pw-key > p{margin:0 0 14px}
.pw-row{display:flex;flex-wrap:wrap;gap:10px}
.pw-row input[type=text]{flex:1 1 230px;min-width:0;width:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;letter-spacing:.02em}
.pw-row input[type=text]:disabled{background:#F3EEE3;color:var(--muted)}
.pw-row input.bad{border-color:var(--bad)}
.pw-row .btn{flex:1 1 130px}
.pw-row .btn[disabled]{opacity:.6;cursor:default}
.pw-status{display:flex;gap:8px;align-items:flex-start;margin:12px 0 0;font-size:.94rem;line-height:1.5}
.pw-status:empty{display:none}
.pw-status > span{min-width:0}
.pw-status .ic{margin-top:.22em}
.pw-status.err{color:var(--bad)}
.pw-status.ok{color:var(--ok);font-weight:600}
.pw-status.info,.pw-status.busy{color:var(--muted)}
.spin{display:inline-block;flex:0 0 auto;width:1em;height:1em;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;vertical-align:-.15em}
.pw-status .spin{margin-top:.22em}
@keyframes spin{to{transform:rotate(360deg)}}
.pw-keybox{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.95rem;background:#fff;border:1px dashed var(--gold);border-radius:12px;padding:12px 14px;word-break:break-all;margin:8px 0 10px}
.badge.pay{background:var(--sand);color:var(--ink)}
/* ===== AI at Work: prompts, before/after, checklists, builder, toolkit ===== */
.prompt{background:#FFFDF8;border:1px solid var(--line);border-radius:var(--r-md);margin:0 0 1.2em;overflow:hidden;box-shadow:0 1px 0 rgba(20,32,27,.04)}
.pr-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px 9px 16px;background:var(--ink);color:var(--cream)}
.pr-t{font-weight:700;font-size:.92rem;min-width:0;line-height:1.35}
.copy{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid rgba(200,169,106,.6);background:rgba(200,169,106,.16);color:var(--cream);font-size:.84rem;font-weight:600;cursor:pointer}
.copy .ic{width:15px;height:15px}
.copy.done{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.copy[disabled]{opacity:.45;cursor:default}
.copy:focus-visible,.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pr-body{margin:0;padding:14px 16px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86rem;line-height:1.6;color:var(--ink)}
.pr-body mark{background:#F3E3BC;color:var(--ink);border-radius:4px;padding:0 2px}
.ba{margin:0 0 1.3em;display:grid;gap:8px}
.ba-row{border-radius:var(--r-md);padding:12px 14px 12px 16px;min-width:0}
.ba-row.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}
.ba-row.good{background:var(--ok-bg);border-left:4px solid var(--ok)}
.ba-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.ba-tag{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.ba-row.bad .ba-tag{color:var(--bad);margin-bottom:4px}
.ba-row.good .ba-tag{color:var(--ok)}
.ba-tag .ic{width:15px;height:15px}
.ba-x{margin:0;white-space:pre-wrap;font-size:.97rem;line-height:1.6}
.ba-row.good .copy{background:#fff;color:var(--ok);border-color:rgba(46,107,78,.45)}
.ba-row.good .copy.done{background:var(--ok);color:#fff}
.ba-why{margin:2px 2px 0;font-size:.92rem;color:var(--muted)}
.checklist{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:var(--r-md);padding:14px 16px;margin:0 0 1.3em}
.ck-head{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;margin-bottom:6px}
.ck-head b{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;min-width:0}
.ck-head b .ic{color:var(--ok);width:1.2em;height:1.2em;flex:0 0 auto}
.ck-count{font-size:.8rem;font-weight:700;color:var(--muted);background:rgba(20,32,27,.07);border-radius:999px;padding:2px 10px;white-space:nowrap}
.checklist.all .ck-count{background:var(--ok-bg);color:var(--ok)}
.checklist ul{list-style:none;margin:0;padding:0}
.checklist li{border-top:1px solid var(--line)}
.checklist li:first-child{border-top:0}
.checklist label{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer;line-height:1.5}
.checklist input{flex:0 0 auto;width:22px;height:22px;margin:1px 0 0;accent-color:var(--ok)}
.checklist label span{min-width:0}
.checklist input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(20,32,27,.35)}
.builder{background:#FFFDF8;border:1px solid rgba(200,169,106,.6);border-radius:var(--r-lg);padding:clamp(16px,4vw,22px);margin:0 0 1.4em;box-shadow:var(--shadow)}
.bd-head h3{margin:.3em 0 .2em}
.bd-head p{color:var(--muted);font-size:.95rem;margin:0 0 12px}
.bd-eb{display:inline-flex;align-items:center;gap:8px;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold-d)}
.bd-f{margin:0 0 12px}
.bd-f label{display:block;margin-bottom:6px;line-height:1.35}
.bd-f label b{display:block;font-size:.98rem}
.bd-f label span{display:block;font-size:.86rem;color:var(--muted)}
.bd-f textarea{min-height:50px;margin:0;font-size:16px;line-height:1.45;resize:none;overflow:hidden}
.bd-f input[type=text]{font-size:16px}
.chips-row{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 16px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;min-height:36px;font-size:.84rem;cursor:pointer;color:var(--ink);max-width:100%;text-align:left}
.chip:hover{border-color:var(--gold)}
.bd-out{margin-bottom:12px}
.bd-out .pr-body{min-height:64px}
.bd-actions{display:flex;flex-wrap:wrap;gap:10px}
.bd-actions .btn{flex:1 1 160px;min-height:42px;font-size:.92rem}
.tk-group{margin:22px 0 0}
.tk-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:1.15rem;margin-bottom:12px}
.tk-n{font-family:var(--sans);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-d);font-weight:700}
.tk-lock{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--paper);border:1px dashed rgba(20,32,27,.25);border-radius:var(--r-md);padding:12px 14px}
.tk-lock > svg{width:20px;height:20px;color:var(--gold-d);flex:0 0 auto}
.tk-lock > span{flex:1 1 180px;min-width:0;font-size:.95rem}
.tk-lock .btn{min-height:38px;padding:6px 16px;font-size:.9rem}
@media (min-width:900px){body{font-size:18px}}
@media print{
 body{background:#fff}
 .top,footer.foot,.no-print,.phead,.timer{display:none!important}
 .cert{box-shadow:none;margin:0}
 .cert-in{padding:40px 70px 64px}
 main.enter{animation:none}
 main .wrap{max-width:100%;padding:0}
 .cert .c-note{color:#333}
 .cert,.cert-in{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 main{padding:0}
}
</style>
</head>
